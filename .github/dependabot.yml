version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      # vitest and its @vitest/* companions (coverage-v8 is pinned to the exact vitest version) must bump together.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
