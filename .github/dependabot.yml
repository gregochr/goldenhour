version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    ignore:
      # anthropic-java 2.63.0+ removed the OkHttpClient(okhttp3.OkHttpClient, Backend)
      # constructor AppConfig uses to force HTTP/1.1 (virtual-thread pinning on Java 21).
      # Lift this once the app runs on JDK 24+ or ships its own HttpClient — see
      # backend/pom.xml and AppConfig#anthropicClient.
      # The runtime is now Java 25 (JEP 491), so this ignore rule can be lifted in a follow-up.
      - dependency-name: "com.anthropic:anthropic-java"
        versions: [">= 2.63.0"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
