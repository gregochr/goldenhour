name: Deploy
on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    name: Run CI
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version tag
        id: tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          no-cache: true
          build-args: |
            APP_VERSION=${{ steps.tag.outputs.VERSION }}
          tags: |
            ghcr.io/gregochr/goldenhour-backend:latest
            ghcr.io/gregochr/goldenhour-backend:${{ steps.tag.outputs.VERSION }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          no-cache: true
          build-args: |
            VITE_TURNSTILE_SITE_KEY=0x4AAAAAACkZr4aO-Px_Wy6t
          tags: |
            ghcr.io/gregochr/goldenhour-frontend:latest
            ghcr.io/gregochr/goldenhour-frontend:${{ steps.tag.outputs.VERSION }}

  deploy:
    name: Deploy to Production
    runs-on: self-hosted
    needs: build-and-push
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        with:
          host: 100.76.73.16
          username: gregochr
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: RELEASE_VERSION
          script: |
            set -e
            cd ~/goldenhour
            mkdir -p /Users/gregochr/goldenhour-data/logs

            # Back up BEFORE pulling. `docker compose pull` overwrites :latest,
            # which is the only other handle on the outgoing build — after that
            # there is nothing left to record, and nothing to roll back to.
            #
            # The script is taken from the tag being released rather than from
            # the working copy on this host: nothing here ever runs `git pull`,
            # so the checkout can be arbitrarily old, and a stale backup script
            # is exactly the failure this is meant to prevent.
            git fetch origin --tags --quiet
            git show "${RELEASE_VERSION}:scripts/pre-release-backup.sh" > /tmp/pre-release-backup.sh
            chmod +x /tmp/pre-release-backup.sh
            /tmp/pre-release-backup.sh "${RELEASE_VERSION}"

            docker compose pull goldenhour-backend goldenhour-frontend
            docker compose up -d --no-deps goldenhour-backend goldenhour-frontend
            sleep 30
            docker compose ps
