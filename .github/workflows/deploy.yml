name: Deploy
on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    name: Run CI
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version tag
        id: tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          no-cache: true
          build-args: |
            APP_VERSION=${{ steps.tag.outputs.VERSION }}
          tags: |
            ghcr.io/gregochr/goldenhour-backend:latest
            ghcr.io/gregochr/goldenhour-backend:${{ steps.tag.outputs.VERSION }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          no-cache: true
          build-args: |
            VITE_TURNSTILE_SITE_KEY=0x4AAAAAACkZr4aO-Px_Wy6t
          tags: |
            ghcr.io/gregochr/goldenhour-frontend:latest
            ghcr.io/gregochr/goldenhour-frontend:${{ steps.tag.outputs.VERSION }}

  deploy:
    name: Deploy to Production
    runs-on: self-hosted
    needs: build-and-push
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        with:
          host: 100.76.73.16
          username: gregochr
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: RELEASE_VERSION
          script: |
            set -e
            cd ~/goldenhour
            mkdir -p /Users/gregochr/goldenhour-data/logs

            # Refuse to deploy over an active rollback pin.
            #
            # scripts/rollback.sh writes docker-compose.override.yml, which Compose
            # auto-loads — so without this guard the `docker compose up` below would
            # silently apply the pinned OLD digests and the release would appear to
            # succeed while deploying nothing. Fail loudly instead: clearing the pin
            # is a deliberate act, not something a deploy should do behind your back.
            if [ -f docker-compose.override.yml ]; then
              echo "ERROR: docker-compose.override.yml exists — production is pinned by a rollback." >&2
              echo "       Deploying now would silently re-apply the pinned images." >&2
              echo "       Remove it once you are ready to roll forward:  rm ~/goldenhour/docker-compose.override.yml" >&2
              exit 1
            fi

            # Everything below reads from the tag being released rather than from
            # this host's working copy, because nothing here ever runs `git pull` —
            # the checkout can be arbitrarily old. Fetch first: without it
            # `git show <tag>:...` fails for a tag this host has never seen, which
            # is every tag.
            git fetch origin --tags --quiet

            # `docker compose` reads these from THIS directory, so a stale tree
            # ships new images against months-old config. nginx.conf matters most:
            # it is bind-mounted rather than baked into the frontend image
            # (frontend/Dockerfile copies only /app/dist), so it is delivered here
            # or not at all — which is why today's CSP and security headers would
            # otherwise never have reached production.
            git show "${RELEASE_VERSION}:nginx.conf" > nginx.conf
            git show "${RELEASE_VERSION}:docker-compose.yml" > docker-compose.yml

            # Back up BEFORE pulling. `docker compose pull` overwrites :latest,
            # which is the only other handle on the outgoing build — after that
            # there is nothing left to record, and nothing to roll back to.
            git show "${RELEASE_VERSION}:scripts/pre-release-backup.sh" > /tmp/pre-release-backup.sh
            chmod +x /tmp/pre-release-backup.sh
            /tmp/pre-release-backup.sh "${RELEASE_VERSION}"

            docker compose pull goldenhour-backend goldenhour-frontend
            docker compose up -d --no-deps goldenhour-backend goldenhour-frontend
            sleep 30
            docker compose ps

  # Deploy was the only workflow in the repo with no failure notifier, which is
  # the worst place to lack one: a failed deploy leaves the tag pushed, the images
  # in GHCR and CHANGELOG updated, while production quietly keeps serving the old
  # build. Every other signal says the release shipped.
  notify-failure:
    needs: [test, build-and-push, deploy]
    if: failure()
    permissions:
      issues: write
    uses: ./.github/workflows/ci-failure-issue.yml
    with:
      workflow-name: Deploy to Production
