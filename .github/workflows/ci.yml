name: CI

on:
  push:
    branches: [main]
  # NO `branches:` filter here, deliberately.
  #
  # It used to read `branches: [main]`, which means "only PRs whose BASE is main". A stacked
  # PR — one opened against another feature branch so a large change can be reviewed and
  # rolled back in pieces — never matches, so CI never runs on it. And because branch
  # protection's required checks apply to `main`, a PR targeting anything else has no
  # required checks either: it merges green with nothing having run.
  #
  # That is exactly how #361 (a prompt/batching change) merged into its parent branch in
  # July 2026 with zero CI. Nothing broke, because the branch had been verified locally
  # first — but the gate was silent, not satisfied, and silence is indistinguishable from
  # a pass on the PR page.
  #
  # Unfiltered, CI runs for a PR against any base. The cost is one extra run when a stacked
  # PR is later retargeted at main; the alternative is an ungated merge path.
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Docs-only detection ──────────────────────────────────────────────────────
  # A CHANGELOG, docs/ or landing/ change cannot break a test (landing/ is the static
  # marketing site, deployed by release-landing.sh and never built here), so running the full suite for
  # one costs ~8 minutes to prove nothing.
  #
  # The obvious approach — `paths-ignore` on the trigger — is a TRAP here. Branch
  # protection requires "Backend — Build, Test & Coverage" and "Frontend — Lint,
  # Test & Build" to REPORT. A workflow filtered out by path never runs, so those
  # checks never report, and the PR sits BLOCKED forever with no way to satisfy it.
  #
  # So the jobs always run and always report; only their expensive STEPS are
  # skipped. A docs-only PR still shows both checks green, in seconds.
  #
  # Fail-safe by construction: every ambiguous case (not a PR, empty diff, any
  # non-doc path, any error) yields docs_only=false and the full suite runs. The
  # only route to skipping is an explicit, non-empty diff of documentation and the
  # landing site alone.
  changes:
    name: Detect docs-only change
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        name: Classify the diff
        run: |
          set -euo pipefail
          # push to main and workflow_call (the deploy path) ALWAYS run in full —
          # a release must be verified whatever it happens to contain.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Event is ${{ github.event_name }}, not pull_request — running the full suite."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE='${{ github.event.pull_request.base.sha }}'
          HEAD='${{ github.event.pull_request.head.sha }}'
          CHANGED=$(git diff --name-only "$BASE" "$HEAD" || true)

          if [ -z "$CHANGED" ]; then
            echo "Empty diff — running the full suite rather than guessing."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files:"
          echo "$CHANGED" | sed 's/^/  /'

          # Documentation is *.md anywhere, or anything under docs/; the landing site is
          # anything under landing/ (root only, so backend/landing/ still counts as code), EXCEPT
          # landing/guide/ (the frontend suite pins its section ids), landing/nginx.conf,
          # landing/Dockerfile and landing/security-headers.conf (the framing headers are checked
          # by the frontend suite and the landing nginx -t step), which count as code.
          # release-landing.sh sits at the repo root, so it is already code.
          # Deliberately narrow: .github/workflows/** is code, and so is everything else.
          NON_DOC=$(echo "$CHANGED" | grep -vE '(^docs/|\.md$|^landing/)' || true)
          LANDING_CODE=$(echo "$CHANGED" | grep -E '^landing/(guide/|nginx\.conf$|Dockerfile$|security-headers\.conf$)' || true)
          NON_DOC=$(printf '%s\n%s' "$NON_DOC" "$LANDING_CODE" | sed '/^$/d')

          if [ -z "$NON_DOC" ]; then
            echo "Documentation or the landing site only — the suite proves nothing here, skipping it."
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "Non-documentation paths present:"
            echo "$NON_DOC" | sed 's/^/  /'
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Backend ──────────────────────────────────────────────────────────────────
  backend:
    needs: changes
    name: Backend — Build, Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.docs_only != 'true'
        with:
          # diff-cover needs the base branch's history to compute the PR diff.
          fetch-depth: 0

      - name: Set up JDK 25
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # Most tests use H2 in-memory (src/test/resources/application.yml), but the five
      # IntegrationTestBase subclasses start a Testcontainers postgres:17-alpine and run
      # the real Flyway migrations — so this job DOES need a working Docker daemon.
      # (ubuntu-latest ships one; a runner without Docker will fail those five classes.)
      # mvn verify also runs JaCoCo (80% line minimum) and SpotBugs — see below.
      - name: Build, test, and verify coverage
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          chmod +x backend/mvnw
          cd backend && ./mvnw clean verify --batch-mode --no-transfer-progress

      # Changed-lines coverage: at least 90% of the lines a PR adds or changes under backend/src/main
      # must be covered (the per-class and bundle floors cannot see a PR that adds untested code to an
      # already-high class). diff-cover reads the JaCoCo XML, whose sourcefile paths are package-relative
      # (com/gregochr/.../Foo.java), so `--src-roots` maps them onto backend/src/main/java; tests and
      # resources are absent from the report and never count. Run from the repo root so the diff paths
      # (backend/src/main/java/...) line up. A wrong mapping reports "No lines with coverage
      # information" and passes, so the local proof in dev-and-testing.md must show real percentages.
      # Line coverage only. Pull requests only: a push to main has no PR diff.
      - name: Set up Python (diff-cover)
        if: needs.changes.outputs.docs_only != 'true' && github.event_name == 'pull_request'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Changed-lines coverage (diff-cover, 90%)
        if: needs.changes.outputs.docs_only != 'true' && github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          pip install diff-cover==10.0.0
          git fetch --no-tags origin "${{ github.base_ref }}"
          set +e
          diff-cover backend/target/site/jacoco/jacoco.xml \
            --src-roots backend/src/main/java \
            --compare-branch="origin/${{ github.base_ref }}" \
            --fail-under=90 \
            --format markdown:"$RUNNER_TEMP/diff-cover.md"
          STATUS=$?
          set -e
          {
            echo "### Changed-lines coverage (backend, minimum 90%)"
            cat "$RUNNER_TEMP/diff-cover.md" 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$STATUS"

      # NOTE: there is deliberately NO separate FindSecBugs step here.
      # `clean verify` above already runs the identical security analysis: backend/pom.xml
      # binds spotbugs-maven-plugin execution `spotbugs-check` to the verify phase
      # (<goal>check</goal>), and findsecbugs-plugin:1.14.0 sits in that plugin's
      # plugin-level <configuration>/<plugins>, which Maven applies to every invocation of
      # the plugin — lifecycle-bound or CLI. Confirmed empirically: the emitted
      # target/spotbugsXml.xml carries <Plugin id='com.h3xstream.findsecbugs' enabled='true'/>
      # and the findsecbugs detector timings. A standalone
      # `./mvnw compile spotbugs:check` step therefore added no coverage, no extra
      # configuration and no extra detectors — only a second ~34s of checkstyle +
      # jacoco:prepare-agent + spotbugs:spotbugs. Removed 2026-07-26.
      # Do not re-add it: if you want stricter security analysis, change the pom
      # (<threshold>, spotbugs-exclude.xml), not this file.

      # Produced by the forked spotbugs:spotbugs run inside the verify-phase check goal.
      - name: Upload SpotBugs report
        if: always() && needs.changes.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: backend/target/spotbugsXml.xml

      - name: Upload JaCoCo coverage report
        if: always() && needs.changes.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/

      - name: Documentation-only change — suite skipped
        if: needs.changes.outputs.docs_only == 'true'
        run: |
          echo "Every changed path is documentation (*.md or docs/**)."
          echo "The suite was skipped deliberately — see the 'Detect docs-only change' job."
          echo "This check reports success so branch protection is satisfied."

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    needs: changes
    name: Frontend — Lint, Test & Build
    runs-on: ubuntu-latest
    # Added alongside the Vitest `testTimeout` raise in `frontend/vite.config.js`. That raise is a
    # 4x multiplier on what a genuinely hung test costs the runner, and with no job timeout the
    # ceiling was GitHub's default of 360 minutes. This job runs in ~3m and the suite alone is ~8m
    # under load, so 20 gives ample headroom while capping the multiplier. The idiom is already used
    # in `codeql.yml`, `security-scan.yml` and `real-api-smoke.yml`; `ci.yml` simply never had it.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.docs_only != 'true'
        with:
          # diff-cover needs the base branch's history to compute the PR diff.
          fetch-depth: 0

      - name: Set up Node 22
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: needs.changes.outputs.docs_only != 'true'
        run: cd frontend && npm ci

      - name: Lint
        if: needs.changes.outputs.docs_only != 'true'
        run: cd frontend && npm run lint

      - name: Unit tests + coverage floor (Vitest)
        if: needs.changes.outputs.docs_only != 'true'
        run: cd frontend && npm run test:coverage

      # Changed-lines coverage: at least 90% of the lines a PR adds or changes under frontend/src
      # must be covered (the global floor above cannot see a PR that adds untested code to an
      # already-high total). diff-cover reads coverage/lcov.info and ignores diff lines in files
      # absent from lcov, so tests, src/test/** and src/main.jsx never count. A PR that touches no
      # covered source reports "No lines with coverage information in this diff" and exits 0.
      # ⚠️ lcov `SF:` paths are relative to frontend/ but diff-cover resolves them against the repo
      # root, and run from frontend/ it silently matches NOTHING and passes (proved locally). So the
      # step prefixes `SF:` with `frontend/` and runs from the repo root.
      # Line coverage only: diff-cover folds BRDA into line status but cannot gate branches.
      # Pull requests only: a push to main has no PR diff.
      - name: Set up Python (diff-cover)
        if: needs.changes.outputs.docs_only != 'true' && github.event_name == 'pull_request'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Changed-lines coverage (diff-cover, 90%)
        if: needs.changes.outputs.docs_only != 'true' && github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          pip install diff-cover==10.0.0
          git fetch --no-tags origin "${{ github.base_ref }}"
          sed 's#^SF:#SF:frontend/#' frontend/coverage/lcov.info > "$RUNNER_TEMP/lcov-root.info"
          set +e
          diff-cover "$RUNNER_TEMP/lcov-root.info" \
            --compare-branch="origin/${{ github.base_ref }}" \
            --fail-under=90 \
            --format markdown:"$RUNNER_TEMP/diff-cover.md"
          STATUS=$?
          set -e
          {
            echo "### Changed-lines coverage (frontend, minimum 90%)"
            cat "$RUNNER_TEMP/diff-cover.md" 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$STATUS"

      # ⚠️ NOT a bare `npm audit`, and the reason is not the obvious one. This job went red on
      # 2026-09-04 on a PR touching no dependency file, with a 400 from
      # `/-/npm/v1/security/audits/quick` and a notice that the endpoint is being retired — and it
      # passed on re-run with an identical tree.
      #
      # npm does not CHOOSE that endpoint. Arborist 8.x (npm 10, which Node 22 ships) tries the
      # bulk advisory endpoint first and falls back to the quick one when it throws, logging the
      # real failure at `silly` — which CI never prints. So the error on screen came from a
      # fallback nobody picked, while the actual bulk outage stayed invisible. `scripts/npm-audit.sh`
      # carries the full account; in short it runs the audit under npm 11 (which deleted the quick
      # fallback entirely) and retries ONLY on transport errors, never on a finding.
      - name: OWASP Dependency Audit (frontend)
        if: needs.changes.outputs.docs_only != 'true'
        run: ./scripts/npm-audit.sh frontend high

      - name: Build
        if: needs.changes.outputs.docs_only != 'true'
        run: cd frontend && npm run build

      - name: Entry closure (Leaflet stays off the first load)
        if: needs.changes.outputs.docs_only != 'true'
        run: cd frontend && npm run check:entry

      # ⚠️ Nothing else checks nginx.conf's syntax before production. deploy.yml writes the file from
      # the release tag onto the host and recreates the frontend container (`restart: always`), so a
      # stray brace takes app.photocast.online down until a rollback — and neither this machine nor
      # any other step here has nginx. `nginx -t` in the pinned image is the check.
      #
      # The one edit to the file is the upstream: `goldenhour-backend` only resolves on the compose
      # network, and an unresolvable upstream fails `-t` by itself, which would say nothing about
      # the syntax. The sed is guarded on both sides (the name gone, the stub present) so it cannot
      # quietly do nothing and leave the step proving a different file.
      #
      # This step must fail on a broken file. It does so by exit code alone: `nginx -t` exits
      # non-zero on any syntax or semantic error, and `set -e` carries that out of the step.
      - name: nginx -t (nginx.conf syntax)
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          CHECKED="$RUNNER_TEMP/nginx.checked.conf"
          sed 's/goldenhour-backend:8082/127.0.0.1:8082/g' nginx.conf > "$CHECKED"
          if grep -q 'goldenhour-backend' "$CHECKED"; then
            echo "an upstream name is still unresolved in the copy — the stub did not apply" >&2
            exit 1
          fi
          grep -q '127.0.0.1:8082' "$CHECKED"
          docker run --rm -v "$CHECKED:/etc/nginx/nginx.conf:ro" nginx:1.27-alpine nginx -t

      # The access log must never carry a query string: one-time links (/verify?token=, /reset?token=)
      # and stream tokens ride in it (docs/engineering/token-log-redaction-plan.md, step 1). A syntax
      # check cannot see that, so this RUNS the shipped image (nginx:alpine, what frontend/Dockerfile
      # uses) and reads its log. scripts/nginx-log-canary.sh carries the full account and fails by exit
      # code alone: on a CANARY marker in the access log, a missing path/referer, or a missing.js line
      # in the error log. It reuses the stubbed copy the step above wrote.
      - name: nginx access log redaction canary (nginx.conf)
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          CHECKED="$RUNNER_TEMP/nginx.checked.conf"
          test -s "$CHECKED"
          ./scripts/nginx-log-canary.sh "$CHECKED" api 18080

      # landing/nginx.conf had no check at all. Its image bakes the file in, and release-landing.sh ships
      # it separately from the app; security-headers.conf is included from it, so it is mounted beside it.
      - name: nginx -t and redaction canary (landing/nginx.conf)
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/landing/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/landing/security-headers.conf:/etc/nginx/security-headers.conf:ro" \
            nginx:alpine nginx -t
          ./scripts/nginx-log-canary.sh "$PWD/landing/nginx.conf" static 18081 "$PWD/landing/security-headers.conf"

      - name: Documentation-only change — suite skipped
        if: needs.changes.outputs.docs_only == 'true'
        run: |
          echo "Every changed path is documentation (*.md or docs/**)."
          echo "The suite was skipped deliberately — see the 'Detect docs-only change' job."
          echo "This check reports success so branch protection is satisfied."

  # ── Shell scripts ────────────────────────────────────────────────────────────
  # These run on the production host during deploy and rollback, and nothing else
  # executes them — no test in the repo invokes scripts/*.sh, so a shell defect
  # ships straight to production. #364 proved the cost: it deleted the
  # SCHEMA_VERSION_SQL assignment in pre-release-backup.sh and left the use, and
  # because that use ends in `|| echo 'unknown'` the unbound variable was
  # swallowed. Every manifest since recorded schema_version "unknown", and no
  # release failed.
  #
  # -o check-unassigned-uppercase is the whole point of this job. SC2154 is OFF
  # by default for uppercase names, so plain `shellcheck scripts/*.sh` exits 0 on
  # the broken file and would have caught nothing. Verified both ways against the
  # pre-fix version before adding this.
  #
  # release.sh is linted here too, alongside scripts/*.sh: it is the release path —
  # the one script that tags and pushes a production deploy — and it sat outside
  # this job, unchecked, until a silently-swallowed `git fetch` failure in it went
  # unnoticed for exactly the reason this job exists to prevent.
  #
  # Step-level `if:` guards, matching every other job here: a job-level `if:` or a
  # paths filter reports "skipped", and a skipped required check blocks a merge
  # under branch protection rather than passing it.
  shellcheck:
    needs: changes
    name: Shell — ShellCheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.docs_only != 'true'

      # PINNED, and not to the runner's preinstalled shellcheck. The first run of this job failed
      # on an SC2015 that 0.11.0 does not report at any severity — so "green locally" said nothing
      # about CI, which is the one property a gate must have. The image tag is the contract.
      - name: ShellCheck (pinned, with unassigned-uppercase detection)
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 \
            -o check-unassigned-uppercase scripts/*.sh release.sh

      - name: Documentation-only change — suite skipped
        if: needs.changes.outputs.docs_only == 'true'
        run: |
          echo "Every changed path is documentation (*.md or docs/**)."
          echo "The suite was skipped deliberately — see the 'Detect docs-only change' job."
          echo "This check reports success so branch protection is satisfied."

  # ── Playwright E2E smoke ─────────────────────────────────────────────────────
  # A REQUIRED check (docs/engineering/engineering-gaps-plan.md, Phase 2): the real backend (local profile,
  # fresh H2, a FAKE Anthropic key, Ask on its stub) and the built frontend behind the PRODUCTION nginx.conf (nginx:alpine; `vite preview`
  # locally), driven by Chromium. The job name below is the branch-protection string; do not rename it.
  #
  # Step-level `if:` guards and a "skipped" echo step, exactly like the jobs above, and NO job-level `if:`:
  # a skipped required check blocks a merge instead of passing it, and the job needs no secrets, so it also
  # reports on Dependabot PRs.
  #
  # ubuntu-24.04, pinned, never `ubuntu-latest` and never the self-hosted runner (shared with production).
  # Readiness is /actuator/health/container only (db + ping): the bare /actuator/health aggregates the
  # Open-Meteo, tide and Anthropic probes and would tie this gate to third-party uptime. Playwright starts
  # both servers (frontend/playwright.smoke.config.js), so the recipe is the same locally and here.
  e2e:
    needs: changes
    name: E2E — Playwright smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.docs_only != 'true'

      - name: Set up JDK 25
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node 22
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: needs.changes.outputs.docs_only != 'true'
        run: cd frontend && npm ci

      # src/local and src/local-test are outside the backend job (no JaCoCo, checkstyle or SpotBugs there), so the
      # fixture seeder's own gate runs here, before it is packaged into the jar the suite boots. The checkstyle
      # call names generate-test-sources first: -Plocal-dev adds the two source roots in that phase, and a bare
      # `checkstyle:check` would audit neither (it passes with a deliberate violation in src/local).
      - name: Fixture seeder unit tests (local-dev profile)
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          chmod +x backend/mvnw
          cd backend && ./mvnw -Plocal-dev test -Dtest='E2eLocalFixtureSeeder*,E2eRoleUsers*' -DfailIfNoSpecifiedTests=false --batch-mode --no-transfer-progress

      - name: Checkstyle for the local-only source roots
        if: needs.changes.outputs.docs_only != 'true'
        run: cd backend && ./mvnw -Plocal-dev generate-test-sources checkstyle:check --batch-mode --no-transfer-progress

      # -Plocal-dev adds H2 and src/local/java to the jar; the local profile has no Flyway and makes its own
      # schema. The smoke script starts it with photocast.e2e.seed-fixture=true, so the database is not empty:
      # E2eLocalFixtureSeeder writes 3 regions x 6 places and their ratings (but no scheduler_job_config rows:
      # a spec asserts it).
      - name: Build the backend jar (local-dev profile)
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          chmod +x backend/mvnw
          cd backend && ./mvnw -Plocal-dev -Dmaven.test.skip=true package --batch-mode --no-transfer-progress

      - name: Build the frontend
        if: needs.changes.outputs.docs_only != 'true'
        run: cd frontend && npm run build

      # Keyed on the exact pinned version (package.json pins @playwright/test with no caret). The cache holds
      # the browser only; the apt packages it needs are NOT cached, so install-deps always runs.
      - name: Cache Playwright browsers
        if: needs.changes.outputs.docs_only != 'true'
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.64.1

      - name: Install Chromium
        if: needs.changes.outputs.docs_only != 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd frontend && npx playwright install chromium

      - name: Install Chromium system dependencies
        if: needs.changes.outputs.docs_only != 'true'
        run: cd frontend && npx playwright install-deps chromium

      # The suite serves the built frontend through the PRODUCTION nginx.conf in nginx:alpine (frontend/scripts/
      # e2e-smoke-nginx.sh). The pull is its own step so image-pull time is not charged to Playwright's 60 s
      # web-server timeout; the backend job's nginx runs are on another runner.
      - name: Pull the nginx image
        if: needs.changes.outputs.docs_only != 'true'
        run: docker pull nginx:alpine

      # nginx.conf's upstream is goldenhour-backend:8082 and the config is mounted unedited, so in nginx mode the
      # backend listens on 8082 (any other E2E_API_PORT is refused).
      - name: Run the smoke suite
        if: needs.changes.outputs.docs_only != 'true'
        env:
          E2E_WEB: nginx
          E2E_API_PORT: '8082'
        run: cd frontend && npm run test:e2e:smoke

      # Browser hygiene cannot see what the BACKEND does, and the backend runs behind a dead outbound proxy, so
      # nothing can leave the machine anyway; this is the belt to that braces. The seeded fixture must never have
      # run a briefing build (live Open-Meteo weather and two Claude calls) or the Ask fixture seeder. The marker
      # must be PRESENT, or the check could pass on a log from a run that never seeded.
      - name: Assert the backend never built a briefing and did seed the fixture
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          log=frontend/test-results/e2e-logs/backend.log
          test -f "$log" || { echo "::error::$log is missing"; exit 1; }
          grep -aq '\[E2E FIXTURE\] seeded' "$log" || { echo "::error::backend.log has no '[E2E FIXTURE] seeded' line"; exit 1; }
          if grep -anE 'Daily briefing refresh started|Briefing weather fetch|Horizon cloud fetch|\[ASK FIXTURE\]' "$log"; then
            echo "::error::the smoke backend ran a briefing build or the Ask fixture seeder (lines above)"
            exit 1
          fi

      # The report, the traces and both servers' logs, so a red run can be diagnosed without a re-run.
      - name: Upload Playwright report, traces and server logs
        if: failure() && needs.changes.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Documentation-only change — suite skipped
        if: needs.changes.outputs.docs_only == 'true'
        run: |
          echo "Every changed path is documentation (*.md or docs/**)."
          echo "The suite was skipped deliberately — see the 'Detect docs-only change' job."
          echo "This check reports success so branch protection is satisfied."
