name: Backup Verification

# Checks, every morning, that the nightly database backup (a) happened and
# (b) restores. Runs on the self-hosted Docker host because that is where both
# the backups and the Docker socket live.
#
# Why a separate job rather than trusting the backup script's own exit status:
# the backup on this project failed every night from 2026-03-16 to 2026-07-26
# and nobody found out for 132 days. It was *loaded and firing* the whole time,
# exiting 1 into a log file nobody read. A component cannot be relied on to
# report its own failure — so this checks from the outside, and routes through
# the same failure-issue notifier as the rest of the scheduled jobs.
#
# The restore test is the point. A file existing proves almost nothing: a
# truncated dump, a dump of an empty database, and a good backup all look like
# a plausibly-sized .sql.gz. Only restoring it and counting rows tells you
# whether you actually have a backup.
#
# A second job, `runner-watchdog`, runs off-box — see its own comment below.

on:
  schedule:
    # 08:00 UTC — after the 02:00 backup, early enough to matter that day.
    - cron: '0 8 * * *'
  workflow_dispatch:

env:
  BACKUP_DIR: /home/gregochr/goldenhour-backups
  # One missed night is a blip; two consecutive is a trend worth an issue.
  MAX_AGE_HOURS: 48
  SCRATCH_DB: backup-verify-db

jobs:
  verify:
    name: Verify latest backup restores
    runs-on: self-hosted
    # The scratch-Postgres readiness loop above is capped at 60×2s=2min, and
    # restoring a production-sized dump takes a few minutes at worst — thirty
    # is several times the slowest honest run, so anything longer is a hung
    # `docker` call, not a slow one. Without this, a hang leaves the job
    # `in_progress` forever: `runner-watchdog` below accepts `in_progress` as
    # proof the runner is alive and passes, so `notify-failure` (which needs
    # `verify` to reach a terminal state) would never fire either.
    timeout-minutes: 30
    steps:
      - name: Check a recent backup exists
        run: |
          set -euo pipefail

          NEWEST="$(find "${BACKUP_DIR}/daily" -name 'goldenhour_*.sql.gz' -type f \
                    -printf '%T@ %p\n' 2>/dev/null | sort -rn | head -1 | cut -d' ' -f2-)"

          if [ -z "$NEWEST" ]; then
            echo "::error::No backups found in ${BACKUP_DIR}/daily. The nightly backup is not running on this host."
            exit 1
          fi

          AGE_HOURS=$(( ( $(date +%s) - $(stat -c %Y "$NEWEST") ) / 3600 ))
          echo "Newest backup: $NEWEST (${AGE_HOURS}h old, $(du -h "$NEWEST" | cut -f1))"

          if [ "$AGE_HOURS" -gt "$MAX_AGE_HOURS" ]; then
            echo "::error::Newest backup is ${AGE_HOURS}h old (limit ${MAX_AGE_HOURS}h). The nightly backup has stopped."
            tail -20 "${BACKUP_DIR}/backup.log" 2>/dev/null || true
            exit 1
          fi

          echo "NEWEST=$NEWEST" >> "$GITHUB_ENV"

      - name: Restore it into a scratch database and count rows
        run: |
          set -euo pipefail

          docker rm -f "$SCRATCH_DB" >/dev/null 2>&1 || true
          docker run -d --name "$SCRATCH_DB" \
            -e POSTGRES_DB=goldenhour \
            -e POSTGRES_USER=goldenhour \
            -e POSTGRES_PASSWORD=verify-only \
            postgres:17-alpine >/dev/null

          # Query the real database rather than pg_isready — during initdb the
          # entrypoint runs a temporary server on the unix socket, so pg_isready
          # answers "accepting connections" before POSTGRES_DB exists. That exact
          # race is what broke the ZAP workflow for four weeks.
          ready=false
          for _ in $(seq 1 60); do
            if docker exec "$SCRATCH_DB" psql -U goldenhour -d goldenhour -c 'SELECT 1' >/dev/null 2>&1; then
              ready=true; break
            fi
            sleep 2
          done
          [ "$ready" = true ] || { echo "::error::Scratch database never became ready."; exit 1; }

          # No ON_ERROR_STOP: the dump is taken with --clean --if-exists, so
          # restoring into an empty database legitimately emits DROP notices.
          # The row counts below are the real gate, not psql's exit status.
          gunzip -c "$NEWEST" | docker exec -i "$SCRATCH_DB" psql -U goldenhour -d goldenhour >/dev/null 2>&1 || true

          # A failed query and an empty table are different problems and must not
          # report the same way. The first version of this swallowed psql's error
          # with `|| echo 0`, so a mistyped table name ("location" — the table is
          # "locations") surfaced as "no rows … the dump is not usable" and
          # falsely condemned a perfectly good backup on its first ever run.
          fail=0
          for table in forecast_evaluation locations app_user; do
            if ! COUNT="$(docker exec "$SCRATCH_DB" psql -U goldenhour -d goldenhour -tAc \
                          "SELECT count(*) FROM ${table}" 2>&1)"; then
              echo "::error::Could not query ${table} in the restored database — the restore is incomplete or the table is missing: ${COUNT}"
              fail=1
              continue
            fi
            COUNT="$(echo "$COUNT" | tr -d '[:space:]')"
            echo "  ${table}: ${COUNT} rows"
            if [ "${COUNT:-0}" -lt 1 ]; then
              echo "::error::Restored backup has no rows in ${table} — the dump is not usable."
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1

          echo "Backup restored cleanly — this is a verified backup, not just a file."

      # Runs after the restore test on purpose: a broken off-box copy must not
      # stop us proving the backup itself restores.
      - name: Check the off-box copy
        run: |
          set -euo pipefail
          STATUS_FILE="${BACKUP_DIR}/offbox-status"

          if [ ! -f "$STATUS_FILE" ]; then
            echo "::warning::No off-box copy configured (OFFBOX_DEST unset in the systemd unit). Backups exist only on this host, on the same disk as the database they protect."
            exit 0
          fi

          read -r state stamp < "$STATUS_FILE"
          AGE_HOURS=$(( ( $(date +%s) - $(stat -c %Y "$STATUS_FILE") ) / 3600 ))
          echo "Off-box status: ${state} (recorded ${stamp}, ${AGE_HOURS}h ago)"

          # The backup script treats an off-box failure as non-fatal, so this is
          # the only place it surfaces. Reported separately from a missing backup
          # because they are different severities: one means no redundancy, the
          # other means no backup.
          if [ "$state" != "ok" ]; then
            echo "::error::The most recent off-box copy FAILED (${stamp}). The backup exists only on the Docker host — if that disk dies, the database and its backups go together."
            exit 1
          fi

          if [ "$AGE_HOURS" -gt "$MAX_AGE_HOURS" ]; then
            echo "::error::Last successful off-box copy was ${AGE_HOURS}h ago (limit ${MAX_AGE_HOURS}h). Replication has stopped even though local backups are still running."
            exit 1
          fi

          echo "Off-box copy is current — the backup exists on two machines."

      - name: Tear down scratch database
        if: always()
        run: docker rm -f "$SCRATCH_DB" >/dev/null 2>&1 || true

  # "A component cannot be relied on to report its own failure" (see this file's
  # own header) applies to the self-hosted RUNNER itself, not only to the backup
  # script it is here to check. `verify` targets `self-hosted`, which is
  # dockermacmini, the production host — if the Actions runner service on that
  # box fails to come back after a reboot (it does not restart itself; see
  # codeql.yml's identical note on the same runner), a job targeting it does not
  # fail, it QUEUES forever. `notify-failure` below is `needs: verify` /
  # `if: failure()`, and a queued job never reaches `failure()`, so the nightly
  # restore test — and its notifier — would both go silent with nothing in the
  # Actions UI louder than "queued". That is exactly the failure mode this
  # workflow exists to catch for the backup script one layer in: loaded and
  # firing, reporting nothing, for as long as nobody looks.
  #
  # This job is the off-box watchdog that closes it, mirroring the identical
  # one added to `external` in prod-health.yml the same day, and prod-health.yml
  # in turn mirrors codeql.yml's own reason for keeping its required check off
  # the self-hosted runner entirely. It runs on `ubuntu-latest`, needs no
  # checkout, and watches the RUN's own job list rather than asking the runner
  # anything — so it reports even when dockermacmini is completely unreachable.
  runner-watchdog:
    name: Runner watchdog (off-box)
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: 'Watchdog: the self-hosted runner picked up the verify job'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Matched by NAME PREFIX, not the exact string, so a rename of the
          # tail of the `verify` job's `name:` above does not silently disable
          # this watchdog.
          attempts=20
          interval=30
          status=""
          for ((i = 1; i <= attempts; i++)); do
            # `|| true`: a failed `gh api` call must not kill this step under
            # `set -e` — it means "unknown this iteration", not "the runner is
            # fine", so it falls through to the empty-status case below and
            # keeps looping rather than exiting either way.
            status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" \
              --jq '.jobs[] | select(.name | startswith("Verify latest backup")) | .status' 2>/dev/null || true)"
            # Only the two real "the runner picked it up" statuses count as
            # alive. Anything else — "queued", an empty string from a failed or
            # empty `gh api` call, or any other text — is NOT evidence the
            # runner is up, so every other case falls through to the sleep and
            # tries again.
            case "$status" in
              in_progress | completed)
                echo "verify job status: ${status}"
                exit 0
                ;;
            esac
            if [ "$i" -lt "$attempts" ]; then
              sleep "$interval"
            fi
          done
          echo "::error::The self-hosted runner on dockermacmini has not picked up the backup-verification job in 10 minutes — the runner service is probably down (it does not restart itself after every reboot), so the nightly backup is NOT being verified. Check \`systemctl status actions.runner.*\` on the mini."
          exit 1

  notify-failure:
    needs: verify
    # A job killed by `timeout-minutes` does not reliably report `failure` (it
    # can report `cancelled`), so `failure()` alone would miss exactly the
    # case the timeout exists for. A manual cancel of this scheduled workflow
    # opening an issue is an accepted, rare cost.
    if: ${{ always() && needs.verify.result != 'success' }}
    permissions:
      issues: write
    uses: ./.github/workflows/ci-failure-issue.yml
    with:
      workflow-name: Backup Verification

  # A SEPARATE notifier, not folded into the one above via
  # `needs: [verify, runner-watchdog]`: `needs` waits for every listed job to
  # reach a terminal state, so a queued `verify` would hold this issue back for
  # hours — the exact defect being fixed.
  notify-watchdog-failure:
    needs: runner-watchdog
    if: failure()
    permissions:
      issues: write
    uses: ./.github/workflows/ci-failure-issue.yml
    with:
      workflow-name: Backup Verification — runner watchdog
