name: CodeQL Security Analysis

on:
  # Scan the diff so a merge cannot silently add alerts. The weekly-only schedule this
  # replaced meant one feature merge (the NLC scraper, 2026-07-06) added 21 alerts that
  # nobody saw for up to 7 days. The PR check reports only alerts the PR introduces, so
  # a pre-existing backlog never blocks an unrelated change.
  # Unfiltered by base branch, for the same reason as ci.yml: `branches: [main]` silently
  # skips stacked PRs, which is precisely when a diff scan is still wanted.
  pull_request:
  push:
    branches: [main]
  # Kept alongside the PR trigger: a diff scan never re-examines untouched code, so this
  # is what catches new CodeQL queries finding issues in code that has not changed.
  schedule:
    - cron: '0 2 * * MON'  # 2am UTC every Monday (before ZAP at 4am, PIT at 6am)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Mirrors ci.yml's detector, deliberately as a copy rather than a shared workflow: this
  # file must keep reporting even when ci.yml is skipped, and a `workflow_call` dependency
  # between two required gates is a coupling that fails closed in the worst way.
  #
  # Fail-safe by construction, same as ci.yml: every ambiguous case (not a PR, empty diff,
  # any non-doc path, any error) yields docs_only=false and the full scan runs.
  changes:
    name: Detect docs-only change
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        name: Classify the diff
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Event is ${{ github.event_name }}, not pull_request — scanning in full."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE='${{ github.event.pull_request.base.sha }}'
          HEAD='${{ github.event.pull_request.head.sha }}'
          CHANGED=$(git diff --name-only "$BASE" "$HEAD" || true)

          if [ -z "$CHANGED" ]; then
            echo "Empty diff — scanning in full rather than guessing."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files:"
          echo "$CHANGED" | sed 's/^/  /'

          # Same narrow rule as ci.yml: *.md anywhere, or anything under docs/.
          # .github/workflows/** is code and is scanned.
          NON_DOC=$(echo "$CHANGED" | grep -vE '(^docs/|\.md$)' || true)

          if [ -z "$NON_DOC" ]; then
            echo "Documentation only — a diff scan of a diff with no code finds nothing."
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "Non-documentation paths present:"
            echo "$NON_DOC" | sed 's/^/  /'
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  codeql:
    needs: changes
    name: CodeQL Analysis
    # Deliberately ubuntu-latest, NOT self-hosted, because this is a REQUIRED status
    # check on main.
    #
    # The self-hosted runner is the production host. When it is unwell — powered down,
    # Docker wedged, runner service not restarted after a reboot — a job targeting it
    # does not fail, it QUEUES. A required check stuck in `queued` blocks merge without
    # ever reporting, and there is exactly one admin and zero reviewers on this repo, so
    # nothing can clear it. That is unrecoverable in a way the other required checks are
    # not: a red Backend or Frontend check is fixable by a commit, whereas "the runner is
    # offline" is fixable by no commit at all. It also ties the ability to merge *any*
    # change to the health of the box serving production, which is the coupling you least
    # want on the day production is broken.
    #
    # Nothing here needs the self-hosted box. The steps are checkout, setup-java, CodeQL
    # init, `mvnw compile -DskipTests`, analyze — no Docker, no production database, no
    # local paths. solar-utils resolves from JitPack (backend/pom.xml declares
    # https://jitpack.io; the "GitHub Packages" note in CLAUDE.md is stale), so no
    # ~/.m2/settings.xml token is required. ci.yml already runs the strictly larger
    # `./mvnw clean verify` on ubuntu-latest, which proves the build resolves there.
    # The repo is public, so hosted minutes are free.
    #
    # Cost: this job was already the critical path on the PR gate at 8m35s-11m30s
    # (measured over 7 runs) versus the backend job's ~7m, so the gate is CodeQL-bound
    # either way. A hosted runner may be slower still — the PR that makes this change
    # measures it.
    runs-on: ubuntu-latest
    # Belt and braces: converts a hung analysis into a failure a commit can respond to,
    # rather than a check that never reports. ~3x the observed median.
    timeout-minutes: 30
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ needs.changes.outputs.docs_only == 'true' && 'javascript-typescript' || 'javascript-typescript, java-kotlin' }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build backend
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          cd backend && chmod +x mvnw && ./mvnw compile -DskipTests --batch-mode --no-transfer-progress

      - name: Perform CodeQL Analysis (Java/Kotlin)
        if: needs.changes.outputs.docs_only != 'true'
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"

      - name: Perform CodeQL Analysis (JavaScript/TypeScript)
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  notify-failure:
    needs: codeql
    # Unattended runs only. The notifier exists because a scheduled failure reports to an
    # empty room; a pull-request failure reports to the author, who is already looking at
    # the check. Filing an issue for those would be noise that devalues the real alarms.
    if: failure() && github.event_name != 'pull_request'
    permissions:
      issues: write
    uses: ./.github/workflows/ci-failure-issue.yml
    with:
      workflow-name: CodeQL Security Analysis
