name: CI failure issue

# Opens (or updates) a GitHub issue when a scheduled workflow fails.
#
# Why this exists: PIT and ZAP were both red every Monday from 2026-06-29 to
# 2026-07-20 and nothing said so. A gate nobody hears about is not a gate. The
# scheduled workflows have no human watching a run list, so the failure has to
# come and find you.
#
# Deliberately runs on ubuntu-latest, NOT the self-hosted runner: the most
# likely reason a self-hosted job fails is that the self-hosted runner is
# unwell, and a notifier that shares that fate reports nothing.
#
# One open issue per workflow: subsequent failures are added as comments rather
# than filed as new issues, so four consecutive red Mondays produce one issue
# with four comments instead of four issues nobody triages. Closing the issue
# after a fix means the next failure opens a fresh one.

on:
  workflow_call:
    inputs:
      workflow-name:
        description: Human-readable name of the workflow that failed.
        required: true
        type: string

jobs:
  open-issue:
    name: Report failure
    runs-on: ubuntu-latest
    steps:
      - name: Open or update the failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const workflowName = ${{ toJSON(inputs.workflow-name) }};
            const title = `CI: ${workflowName} is failing`;
            const label = 'ci-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                           `/actions/runs/${context.runId}`;

            // Ensure the label exists — issues.create fails on an unknown label.
            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label });
            } catch (e) {
              if (e.status !== 404) throw e;
              await github.rest.issues.createLabel({
                ...context.repo,
                name: label,
                color: 'b60205',
                description: 'A scheduled workflow is failing',
              });
            }

            const body = [
              `**${workflowName}** failed on \`${context.ref.replace('refs/heads/', '')}\`.`,
              '',
              `- Run: ${runUrl}`,
              `- Commit: \`${context.sha.substring(0, 7)}\``,
              `- Triggered by: \`${context.eventName}\``,
              '',
              'Close this issue once the workflow is green again — the next failure will open a new one.',
            ].join('\n');

            // Match on exact title among open issues rather than a search query:
            // the search index lags by up to a minute, which is long enough for
            // two failures in one morning to file duplicate issues.
            const open = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: 'open',
              labels: label,
              per_page: 100,
            });
            const existing = open.find(i => i.title === title && !i.pull_request);

            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: existing.number,
                body,
              });
              core.notice(`Commented on existing issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                ...context.repo,
                title,
                body,
                labels: [label],
              });
              core.notice(`Opened issue #${created.data.number}`);
            }
