name: Production Health

# Runs scripts/prod-health.sh --daily every morning, so a reboot the host
# wants, an expired Tailscale key, a dead cloudflared tunnel or a wrong
# response from the app is a GitHub issue before the owner notices by hand —
# exactly how the 26-update Ubuntu banner sat unapplied until someone logged
# in on 2026-10-01 (see scripts/prod-health.sh's own header). Also runs at
# the end of every deploy, via the `deploy` job in deploy.yml calling the same
# script with `--deploy` directly over SSH — that run is not this workflow,
# but checks the same four things checks 1-4 here do.
#
# Two notifier jobs, not one, and each needs only its own probe — see
# notify-on-host-failure / notify-external-failure below for why. The
# `external` job also runs a watchdog, off the box, for the case where the
# on-host job itself can never fail: see its own watchdog step for why. The
# on-host job also carries its own `timeout-minutes`, for the case where it
# starts running but then hangs against a wedged daemon: see that job's
# comment for the bound, and notify-on-host-failure's own comment for why a
# timeout's `cancelled` conclusion still has to open the issue.

on:
  schedule:
    # 07:00 UTC — before the owner's day.
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  on-host:
    name: On-host checks (compose, cloudflared, tailscale, apt, reboot)
    runs-on: self-hosted
    # Bound derived from the script's own worst case, not guessed: HEALTH_TIMEOUT
    # (180s) plus the external-equivalent 3 attempts at 20s each with 2x10s
    # sleeps between them is about five minutes end to end. Fifteen is three
    # times that slowest honest run — long enough that a genuinely slow check
    # never gets caught by it, short enough that anything past it is a hang
    # against a wedged daemon, not a check still working. Without this, a hung
    # `docker compose ps` lets the job sit `in_progress` forever: the watchdog
    # above accepts `in_progress` as alive and passes, and notify-on-host-failure
    # below can never fire because its dependency never reaches a terminal state.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run scripts/prod-health.sh --daily
        env:
          COMPOSE_DIR: /home/gregochr/goldenhour
        run: scripts/prod-health.sh --daily

  external:
    name: External reachability probe
    runs-on: ubuntu-latest
    permissions:
      actions: read

    # Deliberately NOT self-hosted, and deliberately no checkout: if
    # dockermacmini is down entirely, the self-hosted `on-host` job above
    # never starts and therefore never fails, so nothing would fire — this
    # probe is the one part of the check that must not live on the box it is
    # checking. Same reasoning as ci-failure-issue.yml's own notifier running
    # on ubuntu-latest rather than the runner whose health it reports on.
    steps:
      - name: curl https://app.photocast.online/api/briefing — must answer 401
        run: |
          set -euo pipefail
          # Retried up to 3 times, 10s apart: a single curl through Cloudflare
          # can hit a momentary 502/520 even when production is fine, matching
          # scripts/prod-health.sh's own check_app_answers retry.
          code=""
          for i in 1 2 3; do
            # `|| true`: a curl that gets no HTTP response at all (DNS failure,
            # --max-time exceeded, connection refused) exits non-zero, and
            # under `set -e` that would kill this step on attempt one with no
            # retry and no ::error:: line — exactly the "host is unreachable"
            # case this job exists to catch. Mirrors check_app_answers.
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://app.photocast.online/api/briefing 2>&1 || true)"
            if [ "$code" = "401" ]; then
              echo "HTTP ${code}"
              exit 0
            fi
            if [ "$i" -lt 3 ]; then
              sleep 10
            fi
          done
          echo "HTTP ${code}"
          echo "::error::app.photocast.online answered '${code}', not 401, after 3 attempts (unauthenticated is the alive signal; 502/530 means the tunnel or backend is down)"
          exit 1

      # Watchdog: if the Actions runner service on dockermacmini fails to
      # restart after a reboot while Docker and cloudflared happen to recover
      # on their own, the `on-host` job above QUEUES rather than fails — a
      # self-hosted job targeting an unreachable runner never reports, it
      # just waits forever (the repo already documents this, for the same
      # runner, in codeql.yml). The curl step above still gets its 401 and
      # passes, so without this step neither notifier would ever fire again
      # and the compose/Tailscale/reboot/apt checks would silently stop —
      # the runner reporting on its own health is exactly the thing
      # backup-verify.yml's header says never works. This step is the
      # external half of that fix: it watches the RUN's own job list rather
      # than asking the runner anything.
      - name: 'Watchdog: the self-hosted runner picked up the on-host job'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Matched by NAME PREFIX, not the exact string, so a rename of the
          # parenthetical in the on-host job's `name:` above does not
          # silently disable this watchdog.
          attempts=20
          interval=30
          status=""
          for ((i = 1; i <= attempts; i++)); do
            # `|| true`, as above: a failed `gh api` call must not kill this
            # step under `set -e` — it means "unknown this iteration", not
            # "the runner is fine", so it falls through to the empty-status
            # case below and keeps looping rather than exiting either way.
            status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" \
              --jq '.jobs[] | select(.name | startswith("On-host checks")) | .status' 2>/dev/null || true)"
            # Only the two real "the runner picked it up" statuses count as
            # alive. Anything else — "queued", an empty string from a failed
            # or empty `gh api` call, or any other text — is NOT evidence the
            # runner is up, so every other case falls through to the sleep
            # and tries again.
            case "$status" in
              in_progress | completed)
                echo "on-host job status: ${status}"
                exit 0
                ;;
            esac
            if [ "$i" -lt "$attempts" ]; then
              sleep "$interval"
            fi
          done
          echo "::error::The self-hosted runner on dockermacmini has not picked up the on-host job in 10 minutes — the runner service is probably down (it does not restart itself after every reboot), so the compose, Tailscale, reboot and apt checks are NOT running. Check \`systemctl status actions.runner.*\` on the mini."
          exit 1

  # Two independent notifier jobs, not one `needs: [on-host, external]` job.
  # `needs` waits for EVERY listed job to reach a terminal state — so if
  # dockermacmini is down entirely, `external` fails in seconds but `on-host`
  # sits queued for a self-hosted runner that will never show up, and a single
  # notifier would not open its issue until GitHub eventually cancels that
  # queued job hours later. That is exactly the scenario `external` exists to
  # catch fast. Each notifier therefore needs only its own probe, and each
  # carries a DISTINCT workflow-name: ci-failure-issue.yml keys its
  # one-open-issue-per-workflow rule on that name, and two notifiers racing on
  # the same name could file two issues for the same incident.
  notify-on-host-failure:
    needs: on-host
    # Not `if: failure()`: a job killed by its own `timeout-minutes` is not
    # reliably reported as `failure` on every surface (it can come through as
    # `cancelled`), so `failure()` would miss a genuine hang. A manual cancel
    # of this scheduled workflow opening an issue too is an accepted, rare cost.
    if: ${{ always() && needs.on-host.result != 'success' }}
    permissions:
      issues: write
    uses: ./.github/workflows/ci-failure-issue.yml
    with:
      workflow-name: Production Health — on-host checks

  notify-external-failure:
    needs: external
    if: failure()
    permissions:
      issues: write
    uses: ./.github/workflows/ci-failure-issue.yml
    with:
      workflow-name: Production Health — external probe & runner watchdog
