name: Accessibility scan

# The advisory axe accessibility scan (docs/engineering/engineering-gaps-plan.md, Phase 3c), on the Phase 3b nginx stack.
#
# ⚠️ Its own workflow, deliberately NOT a job in ci.yml: deploy.yml calls ci.yml through `workflow_call` and
# `build-and-push` needs it, so a red advisory job inside ci.yml would block every release. This file has no
# `workflow_call`, so nothing depends on it.
#
# ADVISORY: it is not a required check and a red run never blocks a merge or a release (serious and critical
# violations fail it by design until each rule has been fixed in its own PR). Plain `paths-ignore` is right here
# because, unlike the required checks, nothing waits for this one to report.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  a11y:
    name: E2E — accessibility (advisory)
    # ubuntu-24.04, pinned, never `ubuntu-latest` and never the self-hosted runner (shared with production).
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      # The seeder's unit tests and checkstyle run in the smoke job (ci.yml), not here.
      - name: Build the backend jar (local-dev profile)
        run: |
          chmod +x backend/mvnw
          cd backend && ./mvnw -Plocal-dev -Dmaven.test.skip=true package --batch-mode --no-transfer-progress

      - name: Build the frontend
        run: cd frontend && npm run build

      # Keyed on the exact pinned version, as in the smoke job. The cache holds the browser only.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.64.1

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd frontend && npx playwright install chromium

      - name: Install Chromium system dependencies
        run: cd frontend && npx playwright install-deps chromium

      - name: Pull the nginx image
        run: docker pull nginx:alpine

      # nginx.conf's upstream is goldenhour-backend:8082 and the config is mounted unedited, so the backend
      # listens on 8082 in nginx mode (any other E2E_API_PORT is refused).
      - name: Run the accessibility scan
        env:
          E2E_WEB: nginx
          E2E_API_PORT: '8082'
        run: cd frontend && npm run test:e2e:a11y

      # Folds the per-scan records into a table on the run's summary page, whatever the scan's verdict.
      - name: Accessibility summary
        if: always()
        run: cd frontend && npm run a11y:summary

      - name: Upload the accessibility report, per-scan records and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-a11y
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
