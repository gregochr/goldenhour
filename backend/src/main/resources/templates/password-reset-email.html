<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Password Reset — PhotoCast</title>
    <th:block th:replace="~{fragments/email-brand :: brandHead}"></th:block>
</head>
<body style="margin:0;padding:0;background-color:#181210;font-family:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#181210;padding:32px 16px;">
    <tr>
        <td align="center">
            <table role="presentation" width="520" cellpadding="0" cellspacing="0" style="background-color:#221A15;border:1px solid #3A2C23;border-radius:12px;overflow:hidden;">
                <!-- Header -->
                <tr th:replace="~{fragments/email-brand :: brandHeader}"></tr>
                <!-- Body -->
                <tr>
                    <td style="padding:32px;text-align:left;">
                        <h2 style="margin:0 0 20px;color:#F2E7D3;font-family:'Newsreader',Georgia,'Times New Roman',serif;font-size:22px;font-weight:600;line-height:1.2;">Password reset</h2>
                        <p style="margin:0 0 16px;color:#F2E7D3;font-size:15px;line-height:1.6;">
                            Hi <strong th:text="${username}" style="color:#F2E7D3;">user</strong>,
                        </p>
                        <p style="margin:0 0 24px;color:#ABA192;font-size:15px;line-height:1.6;">
                            Your password has been reset by an administrator. Use the temporary password below to sign in.
                        </p>
                        <!-- Credentials box -->
                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#181210;border:1px solid #3A2C23;border-radius:8px;margin-bottom:24px;">
                            <tr>
                                <td style="padding:20px 24px;">
                                    <p style="margin:0 0 8px;color:#ABA192;font-family:'IBM Plex Mono','Courier New',monospace;font-size:11px;text-transform:uppercase;letter-spacing:1.5px;">Username</p>
                                    <p th:text="${username}" style="margin:0 0 16px;color:#F2E7D3;font-size:16px;font-weight:600;">user</p>
                                    <p style="margin:0 0 8px;color:#ABA192;font-family:'IBM Plex Mono','Courier New',monospace;font-size:11px;text-transform:uppercase;letter-spacing:1.5px;">Temporary Password</p>
                                    <p th:text="${temporaryPassword}" style="margin:0;color:#F2E7D3;font-size:18px;font-weight:700;font-family:'IBM Plex Mono','Courier New',monospace;letter-spacing:1px;">password</p>
                                </td>
                            </tr>
                        </table>
                        <p style="margin:0 0 8px;color:#ABA192;font-size:15px;line-height:1.6;">
                            You will be asked to choose a new password when you sign in.
                        </p>
                        <p style="margin:0;color:#ABA192;font-size:13px;line-height:1.5;">
                            If you did not expect this email, please contact your administrator.
                        </p>

                    </td>
                </tr>
                <!-- Footer -->
                <tr th:replace="~{fragments/email-brand :: brandFooter}"></tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
