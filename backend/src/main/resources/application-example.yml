anthropic:
  api-key: YOUR_ANTHROPIC_API_KEY

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/goldenhour
    username: YOUR_DB_USER
    password: YOUR_DB_PASSWORD
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        # Batch eager @ElementCollection loads on LocationEntity into IN-queries (see prod config).
        default_batch_fetch_size: 32
  flyway:
    enabled: true
  mail:
    host: smtp.livemail.co.uk
    port: 587
    username: noreply@photocast.online
    password: YOUR_MAIL_PASSWORD
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
notifications:
  admin-alerts:
    # Emails every enabled ADMIN account when a pipeline run is marked DEGRADED (see
    # AdminAlertService). Default is false when this key is absent at all — set explicitly per
    # profile so intent is never ambiguous.
    enabled: true

cost:
  # Token-based pricing (USD per million tokens) — matches Anthropic published rates
  haiku-input-usd-per-mtok: 1.00
  haiku-output-usd-per-mtok: 5.00
  haiku-cache-write-usd-per-mtok: 1.25
  haiku-cache-write-1h-usd-per-mtok: 2.00   # 2x input; the 1-hour cache lifetime
  haiku-cache-read-usd-per-mtok: 0.10
  sonnet-input-usd-per-mtok: 3.00
  sonnet-output-usd-per-mtok: 15.00
  sonnet-cache-write-usd-per-mtok: 3.75
  sonnet-cache-write-1h-usd-per-mtok: 6.00   # 2x input; the 1-hour cache lifetime
  sonnet-cache-read-usd-per-mtok: 0.30
  sonnet55-input-usd-per-mtok: 2.00
  sonnet55-output-usd-per-mtok: 10.00
  sonnet55-cache-write-usd-per-mtok: 2.50
  sonnet55-cache-write-1h-usd-per-mtok: 4.00   # 2x input; the 1-hour cache lifetime
  sonnet55-cache-read-usd-per-mtok: 0.20
  # Haiku 5.5: these are the rates for prompts up to 100K tokens (all of ours); above 100K the
  # rates are 0.50 input / 2.50 output (cache rates scale with input)
  haiku55-input-usd-per-mtok: 0.10
  haiku55-output-usd-per-mtok: 0.50
  haiku55-cache-write-usd-per-mtok: 0.125
  haiku55-cache-write-1h-usd-per-mtok: 0.20   # 2x input; the 1-hour cache lifetime
  haiku55-cache-read-usd-per-mtok: 0.01
  opus-input-usd-per-mtok: 5.00
  opus-output-usd-per-mtok: 25.00
  opus-cache-write-usd-per-mtok: 6.25
  opus-cache-write-1h-usd-per-mtok: 10.00   # 2x input; the 1-hour cache lifetime
  opus-cache-read-usd-per-mtok: 0.50
  # Non-Anthropic flat costs (micro-dollars)
  world-tides-micro-dollars: 3000   # ~$0.003 per call
  open-meteo-micro-dollars: 0       # free

jwt:
  secret: YOUR_JWT_SECRET_BASE64   # generate with: openssl rand -base64 32
  access-token-expiry-hours: 24
  refresh-token-expiry-days: 30

turnstile:
  secret-key: YOUR_TURNSTILE_SECRET_KEY  # Cloudflare Turnstile

openrouteservice:
  api-key: YOUR_ORS_API_KEY  # https://openrouteservice.org — free tier: 2000 requests/day
  enabled: true              # set to false to disable drive-time refresh without removing the key

aurora:
  enabled: true
  light-pollution-api-key: ${LIGHT_POLLUTION_API_KEY}  # https://www.lightpollutionmap.info
  light-pollution:
    api-url: https://www.lightpollutionmap.info/api/queryraster
    query-layer: sb_2025          # Sky Brightness 2025 (replaces wa_2015 World Atlas)
  noaa:
    kp-url: https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json
    kp-forecast-url: https://services.swpc.noaa.gov/products/noaa-planetary-k-index-forecast.json
    ovation-url: https://services.swpc.noaa.gov/json/ovation_aurora_latest.json
    solar-wind-url: https://services.swpc.noaa.gov/json/rtsw/rtsw_mag_1m.json
    solar-wind-plasma-url: https://services.swpc.noaa.gov/json/rtsw/rtsw_wind_1m.json
    alerts-url: https://services.swpc.noaa.gov/products/alerts.json
  triggers:
    kp-threshold: 5.0
    ovation-probability-threshold: 20.0
    kp-forecast-lookahead-hours: 6   # aurora batch job's level check only; polling reads to dawn
  bortle-threshold:
    moderate: 4   # max Bortle class for MODERATE alerts
    strong: 5     # max Bortle class for STRONG alerts (relax threshold for bright displays)

nlc:
  sighting-enabled: true                                  # scrape NLCNET and expose GET /api/nlc/sighting
  sightings-url: "https://ed-co.net/nlcnet/{year}-{month}"  # live per-month real-time season table.
                                              # {year}/{month} are resolved from the current date at
                                              # scrape time (e.g. .../2026-july), so it follows the
                                              # May–August season automatically. Off-season the page
                                              # 404s and the scrape fails open. For a fixed page, set a
                                              # placeholder-free URL — e.g. the archive https://ed-co.net/nlcnet/
                                              # (the parser reads both the table and the gallery caption layout).
  freshness-hours: 6                          # max age of a report for it to count as a live sighting
  cache-ttl-minutes: 10                       # how long scraped reports are cached between re-scrapes
  source: NLCNET                              # attribution shown as "… via NLCNET"
  hex-colour: "#8E86D6"                       # NLC violet driving the banner accent

coming-up:
  scoring:                                    # the surprise model, S = rarity + magnitude, in bits.
                            # Band edges are CENSUS-SET (P5, ComingUpAnnualBadgeCensusTest): a
                            # synthetic year of daily feed assemblies fires 11 badges of which one
                            # (the eclipse) clears interrupt — the design's ~10/year, one-or-two
                            # interrupts target. The census re-runs on every build.
    bands:
      list: 5.0                               # "in the list" band's lower edge (lower-inclusive)
      announce: 7.5                           # "announced" band's lower edge, adds the tab badge
      interrupt: 10.0                         # "interrupt" band's lower edge — the solid ◆ badge.
                            # Census-set from 9.5: at 9.5 every annual-rate topic (5 showers, the
                            # NLC boundary, all 9.5 bits) interrupted — 7/year; at 10.0 only the
                            # eclipse (11.6) clears it
    magnitude:
      median-bits: 1.0                        # assigned when no per-topic distribution exists
      p90-rank: 0.10
      p90-bits: 3.3
      p95-rank: 0.05
      p95-bits: 4.3
      p97-rank: 0.03
      p97-bits: 5.1
      cold-start-min-observations: 60         # below this many stored peaks, bucket rather than
                                               # trust an exact percentile (plan D4)
    rarity:                                   # mean inter-arrival gap in days per deterministic
                            # (ephemeris) topic — SurpriseScore.rarity() takes log2 of this
      spring-tide-mean-gap-days: 14.8         # half the mean synodic month. King runs share this
                                               # rate: a king tide is a big spring, not a rarer
                                               # event of its own (plan D4)
      meteor-shower-mean-gap-days: 365.25     # each named shower peaks once a year
      solar-turning-point-mean-gap-days: 182.625  # two equinoxes and two solstices a year
      nlc-season-mean-gap-days: 365.25        # one season, once a year
      supermoon-mean-gap-days: 60.0           # a full moon within the perigee window, empirically
                                               # a little under every other lunar month
      eclipse-mean-gap-days: 1500.0           # placeholder pending a catalogue-derived figure —
                                               # only five UK-visible eclipses are catalogued at all
      lunar-eclipse-mean-gap-days: 900.0      # documented long-run estimate, NOT the seeded window's
                                               # own mean (six gaps, Mar 2025-2030, average ~290 d —
                                               # that window is unusually dense); log2(900)+1 clears
                                               # the interrupt band, log2(290)+1 would not — lowering
                                               # this is a re-census decision, see the class javadoc
    recurrent:                                # slot-atmosphere retention (SlotAtmosphereCleanupJob)
      trailing-window-days: 60                # look-back the retention readers are sized from

photocast:
  # Solar-relative scheduling (docs/engineering/solar-relative-refresh-plan.md D5). The point a
  # SOLAR_OFFSET job's sunrise/sunset is computed for. Optional: the default is Durham. Both keys
  # must be set together; a missing, non-numeric or out-of-range value never stops startup or
  # scheduling — it logs ERROR and Durham is used.
  #   scheduler:
  #     solar-reference:
  #       lat: 54.776               # degrees north, -90..90
  #       lon: -1.575               # degrees east, -180..180
  # Ask PhotoCast (docs/engineering/ask-photocast-plan.md §2.9). Every key is optional; each default
  # is shown. Uncomment to change one. A value outside its stated range fails startup.
  #   ask:
  #     enabled: false              # the whole feature; false answers 404 on every Ask endpoint and
  #                                 # the client hides Ask. Rollback is this flag: there is no data to unwind
  #     stub: false                 # true = StubAskEngine: no Anthropic call, no cost row. NEVER
  #                                 # true in production (startup refuses it under the prod profile);
  #                                 # false (the default) bills the real key
  #     seed-local-fixture: false   # local profile only, H2 only: writes "Fixture ..." regions,
  #                                 # rated entries and a briefing build into the local database
  #     model: HAIKU                # HAIKU or SONNET only; Sonnet 5.5 is refused (it cannot disable thinking)
  #     max-turns: 4                # model turns per conversation, 1-6
  #     max-tokens: 600             # per model turn, 200-2000
  #     call-timeout-seconds: 20    # per model call, 1-60; must not exceed deadline-seconds
  #     deadline-seconds: 30        # whole conversation, 1-120
  #     rate-per-minute: 5          # per user, in memory, 1-600; checked before the body is read
  #     limit-pro: 30               # typed questions a day, PRO_USER and ADMIN (Ask is Pro-only), 0-1000
  #     engine-ceiling-multiplier: 3  # never-refunded engine calls a day = this x the role's limit, 1-20
  #     daily-spend-cap-usd: 0.50   # typed spend a day (UK date), above 0 and at most 1000; tripping
  #                                 # it answers 503 TYPED_UNAVAILABLE to everyone and emails the
  #                                 # admins once (needs notifications.admin-alerts.enabled)
  #     ready:
  #       max-cycles-per-day: 6     # scheduled Ready precomputes a day, 1-48
  #     cache:
  #       max-entries: 2000         # typed-answer cache, 1-100000
  #       ttl-minutes: 30           # 1-1440
  #     thread:
  #       max-exchanges: 8          # earlier exchanges a follow-up question may carry, 1-20; more is
  #                                 # 400 INVALID (the POST /api/ask body cap follows it: 8 KiB + 10 KiB each)
  #     log:
  #       retention-days: 90        # ask_log rows kept, 1-3650
  # Neighbour guard (docs/engineering/neighbour-guard-plan.md §4). A sky rating far above SEVERAL nearby
  # places that see the same sky is far more likely model noise than a real local difference, so the
  # guard marks such a slot and no surface NAMES it as the single best place (the Plan window pick,
  # the best-reachable line, Ask); it keeps its star. ON BY DEFAULT since G4 (2026-10-17): production
  # needs no config. Every key is optional; each default is shown. Uncomment to change one. A value
  # outside its stated range fails startup.
  #   neighbour-guard:
  #     enabled: true               # rollback is `enabled: false` + a restart: nothing is flagged and no
  #                                 # coordinates are read
  #     radius-km: 5.0              # how near counts as "the same sky", 1-20
  #     min-neighbours: 2           # similar-height nearby places rated `margin` or more below the slot
  #                                 # that are needed to flag it, 1-5. Any nearby place, at any height,
  #                                 # rated less than `margin` below it (or higher) clears the slot
  #     margin: 2                   # stars below the slot that count as disagreement, 2-4
  #     min-rating: 3               # lowest sky rating that can be flagged, 3-5 (a floor below 3 is
  #                                 # unreachable at margin 2); raise it to guard only 4-star claims
  #     max-elevation-gap-m: 150    # two places closer in height than this are "at a similar height", 0-1000
  # Big seas (docs/engineering/big-seas-plan.md §3 B2). A high water at a pier, breakwater or lighthouse
  # is a "big sea" when the wave is tall enough, long enough in period and comes from within
  # `max-onshore-angle-deg` of the way the structure faces. Judged at serve time from the numbers
  # `marine_high_water` stores, so retuning needs no refetch. Every key is optional; each default is
  # shown. Uncomment to change one. A value outside its stated range fails startup.
  #   big-seas:
  #     min-wave-height-m: 3.0      # significant wave height, metres, 0.5-15
  #     max-onshore-angle-deg: 60   # widest angle between wave direction and the structure's bearing, 0-180
  #     min-wave-period-s: 8.0      # mean wave period, seconds, 1-30
  #     half-window-minutes: 90     # half-width sampled around each high water, 15-180 (later refreshes only)
  #     max-sample-age-hours: 30    # stored samples older than this are not served, 1-168
  tide-run:
    preferred-anchor: "St. Mary's Lighthouse"  # location NAME the spring/king tide run's 24-hour
                            # chart is drawn for. Blank restores pure biggest-range selection.
                            # Biggest-range is not neutral across a long roster: tidal range grows
                            # southward on this coast, so the maximum reliably lands at the
                            # southern end — a Bamburgh-to-Bridlington roster anchored every run to
                            # a cove on Flamborough Head, which no reader could place. Range picks
                            # the most dramatic version of the event; the anchor picks the legible
                            # one, and legibility is what the footer naming it was for.
                            # Matched by NAME, case-insensitively — ids differ between local H2 and
                            # production, so a configured id would silently select the wrong coast.
                            # Falls back to biggest range when the anchor is not in the run or has
                            # no drawable day, so a Yorkshire-only topic is never mislabelled.
  registration:
    max-users: 10            # early-access cap (excludes admin accounts; pending sign-ups count)
    default-role: LITE_USER  # role assigned to new self-registered users
    enabled: true
    # A never-verified sign-up holds its place for pending-hold-hours, is reminded with a fresh link when
    # first-reminder-hours-left and final-reminder-hours-left remain, and is deleted 24 h after the final
    # reminder. Each a positive multiple of 24; final >= 24; first - final >= 24; first < hold.
    pending-hold-hours: 168
    first-reminder-hours-left: 72
    final-reminder-hours-left: 24
  # Dormant-account sweep (docs/engineering/audit-followups-plan.md, D). A LITE_USER (never Pro or Admin)
  # unused for inactive-days is warned by email, and deleted grace-days later if they have not signed in.
  # The job row is seeded PAUSED; resume it from the Scheduler screen. dry-run defaults to TRUE: the sweep
  # then only logs what it would warn and delete (also on "Run now"). Set dry-run: false only when ready.
  dormancy:
    dry-run: true            # true = send nothing, stamp nothing, delete nothing; log projections only
    inactive-days: 90        # days without activity before the warning; at least 30
    grace-days: 14           # days between the warning and the deletion; at least 7
  sub-regions:
    enforce: false           # when true, a Lite reader's ratings are limited to their picks (S3 onwards; S2 only reports it)
    grace-days: 7            # a reader's first choice starts this many days (inclusive) of free changes
    lock-days: 30            # after grace, a change that swaps a pick out is allowed once per this many days
  best-bet:
    max-tokens: 4096        # response-token ceiling for the best-bet advisor JSON.
                            # A 1024 ceiling was observed truncating a verbose two-pick
                            # response mid-field (~3656 chars), producing invalid JSON and
                            # zero persisted picks. 4096 clears a full reasoning-plus-two-picks
                            # response with headroom. Configurable without a redeploy.
    fallback-max-age-hours: 30  # age ceiling for the fail-safe stale fallback served when a
                                # cycle's advisor FAILED: a prior successful pick older than this
                                # (or whose event has passed) is NOT resurrected — the API shows
                                # the honest empty state instead. ~30h ≈ one nightly + intraday.
  batch:
    min-prefetch-success-ratio: 0.5  # abort batch if fewer than 50% of weather fetches succeed
    cache-primer:
      enabled: true          # before a scheduled cycle submits its sky buckets, submit a one-request
                             # primer batch per distinct system-prompt cache prefix and wait for it,
                             # so the real requests READ the cache instead of each WRITING it (1.25x).
                             # A prefix whose primer succeeded gets a 1-hour cache lifetime on its real
                             # requests (2x write); nothing else does. false = exactly as before.
      wait-seconds: 180      # the most the cycle waits for all primers together (0..600); 0 = do not
                             # prime. Adds up to this long to the submit phase.
      poll-seconds: 10       # how often the primers are polled while waiting (1..60)
      diagnostics: false     # true = the primer's request opts in to the API's cache diagnostics and each
                             # warmed real request names its primer as the previous message to compare
                             # with, so api_call_log.cache_diagnostics says where it diverged. Adds a
                             # `diagnostics` object to those batch requests (not yet exercised against the
                             # live Batch API); reading diagnostics works whatever this is.
  briefing:
    min-coverage-ratio: 0.5  # API read-path honesty: a region whose Claude-scored fraction
                             # (scoredLocationCount / roster size) is positive but below this
                             # is flagged "lightly evaluated" so the UI frames it as covering
                             # only the evaluated spots, not the whole roster. At 0.5 this is the
                             # routine far-horizon state (sparse scoring is by design). 0.0 disables.
                             # Does NOT change which locations are scored — labelling only.
  eval:
    batch:
      enabled: true              # weekly multi-model sky-rating eval submits via the Anthropic
                                 # Batch API (50% token discount) instead of synchronous per-call
                                 # scoring. false reverts the scheduled job to the sync path; the
                                 # admin single-model trigger is always synchronous either way.
      poll-timeout-seconds: 86400 # fail a still-unfinished eval batch once its runs are older than
                                  # this. The batch id is persisted on each run and reconciled by the
                                  # sky_rating_eval_batch_poll scheduler job (restart-safe), so this
                                  # is only the dead-batch backstop — set to the Batch API's 24 h
                                  # guaranteed-completion window rather than a short await timeout.
  pipeline:
    safety-timeout: PT3H30M  # failure backstop for the batch wait phase (ISO-8601 duration).
                             # ONE budget per cycle: the wait phase and the retry phase share it,
                             # measured from the cycle's first batch submit (earliest
                             # forecast_batch.submitted_at), so a restart cannot extend it.
                             # Anthropic batch latency is load-dependent: nightly batches finish
                             # in minutes, but afternoon (peak load) batches were observed taking
                             # up to ~3h (slowest of 49 cycles: 181 min). 3h30 clears that while
                             # staying under the shortest gap between two cycles (6.4 h).
    evening-safety-timeout: PT2H  # the same budget for the evening sunrise refresh cycle only
                                  # (evening_sunrise_refresh, seeded PAUSED). Range PT30M..PT3H30M;
                                  # a value outside it fails startup. After about two hours the
                                  # bedtime decision has passed, and later results still go live
                                  # through the late-batch briefing rebuild.
  freshness:
    settled-hours: 36              # blocking highs — once-daily refresh rhythm
    transitional-hours: 12         # half synoptic cycle — catches frontal transitions
    unsettled-hours: 4             # nowcasting window — convective evolution
    safety-floor-hours: 2          # absolute minimum to prevent rapid successive triggers
    horizon:                       # caps applied ON TOP of the stability thresholds above, as
                                   # max(safety-floor, min(stability, cap)). Taking the tighter of
                                   # the two means no horizon can ever come out STALER than
                                   # stability alone allowed, so raising a cap is a safe rollback.
                                   #
                                   # Why they exist: the stability thresholds are calibrated on
                                   # synoptic pattern persistence, which is not rating persistence
                                   # — the rating turns on low cloud at the solar horizon, which
                                   # moves freely under a stable pattern. Over 30 days of
                                   # evaluation_delta_log, a SETTLED slot re-evaluated after a 48h
                                   # gap (a gap the 36h threshold itself permits) moved by a full
                                   # star 72% of the time. Without these caps a SETTLED region
                                   # evaluated at T+1 could not be refreshed before its own event.
      t0-hours: 2                  # day of the event — no horizon left to trade against, so this
                                   # sits at the safety floor. Independent of safety-floor-hours
                                   # despite sharing its default: raise the floor and the floor
                                   # governs; set this to 36 to roll back to stability-only at T+0.
      t1-hours: 3                  # survives no cycle boundary — an entry's age runs from when
                                   # its results ARRIVED, so the cap must be under the shortest
                                   # gap between cycles (midwinter morning -> afternoon, ~7h24 at
                                   # Durham) minus the slowest batch still awaited (the 3h30
                                   # safety budget): ~3h54, so 3h. It also clears the fixed
                                   # 01:00/14:00 schedule. Re-derive it if the safety budget
                                   # rises or the cycles move closer. It is
                                   # applied at both cycles by the shared CACHED gate, which runs
                                   # before eligibility, so a T+1 slot clears this gate at both
                                   # cycles. Clearing the FRESHNESS gate is not the same as being
                                   # re-evaluated: a SETTLED T+1 *sunset* is then skipped by
                                   # IntradayEligibilityPolicy, because two further looks are
                                   # guaranteed before it. T+1 sunrise and T+0 sunset are not.
                                   # T+2 and beyond are uncapped; stability alone governs.
  forecast-score:
    dual-write: true               # Pass 2: dual-write component scores to forecast_score
                                   # alongside the serving path (results_json untouched). Whole-pass
                                   # rollback = set false (no redeploy); nothing reads the table yet.
  slot-atmosphere:
    write: true                    # Stage B: capture every candidate slot's atmospheric readings
                                   # (dust/surge/snow) to slot_atmosphere at submission time — the
                                   # readings half of the unified hot-topic read surface. Rollback =
                                   # set false (additive table, no redeploy). Renamed from
                                   # photocast.survivor-atmosphere.write in V159 (2026-09-30); the old
                                   # key was read as a legacy alias for the rest of that day only and
                                   # is no longer read at all.
    retention-days: 180            # the nightly slot_atmosphere_cleanup job (03:45 UTC) deletes rows
                                   # whose evaluation_date (the slot's own date) is more than this
                                   # many days before today's UK date; a row exactly this old is
                                   # kept. Owner decision 2026-10-02. Startup REFUSES a value below
                                   # the longest reader window (coming-up.scoring.recurrent.
                                   # trailing-window-days, default 60) — pruning must never delete
                                   # history a reader still asks for.
  forecast-prompt:
    retention-days: 30             # the nightly forecast_prompt_cleanup job (03:50 UTC) deletes
                                   # forecast_evaluation_prompt rows (the stored batch sky user
                                   # message, V164) created more than this many days ago.
  season:
    bluebell:
      start: "04-18"               # bluebell season first active day (MM-dd, inclusive).
                                   # Gates the dedicated bluebell prompt, hot topic, and DTO
                                   # surfacing. Tunable without a redeploy to track an early or
                                   # late spring.
      end: "05-18"                 # bluebell season last active day (MM-dd, inclusive)

cors:
  extra-origins: https://app.example.com,https://www.example.com  # comma-separated list

app:
  frontend-base-url: http://localhost:5173  # production: https://app.photocast.online

server:
  port: 8081
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain,text/css,application/javascript
    min-response-size: 1024

resilience4j:
  circuitbreaker:
    circuitBreakerAspectOrder: 1
    instances:
      # Ask PhotoCast's own breaker (AnthropicApiClient.createAskMessage): a reader's questions must
      # never be able to open the "anthropic" breaker the forecast pipeline shares. No health
      # indicator, so a breaker that opens on questions cannot flip the application's health.
      ask:
        registerHealthIndicator: false
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
      anthropic:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 60s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
      open-meteo:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 65s
        permittedNumberOfCallsInHalfOpenState: 1
        automaticTransitionFromOpenToHalfOpenEnabled: true
  retry:
    retryAspectOrder: 2
    instances:
      # Ask PhotoCast model turns: two attempts, server errors only (AskRetryPredicate).
      ask:
        maxAttempts: 2
        waitDuration: 500ms
      anthropic:
        maxAttempts: 4
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        exponentialMaxWaitDuration: 30s
      # Second, longer-window retry around Anthropic Batch API creation calls
      # (AnthropicBatchClient) — deliberately separate from "anthropic" above and much
      # slower: batch creation is a handful of calls per cycle, hours apart, so ~30s/60s/120s
      # of backoff (~3.5 min total on top of the SDK's own retries) is cheap insurance against
      # a transient Anthropic-side 5xx/timeout. See docs on the 2026-09-29 incident.
      anthropic-batch:
        maxAttempts: 4
        waitDuration: 30s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        exponentialMaxWaitDuration: 120s
      open-meteo:
        maxAttempts: 3
        waitDuration: 5s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
  ratelimiter:
    rateLimiterAspectOrder: 3
    instances:
      open-meteo:
        limitForPeriod: 5
        limitRefreshPeriod: 1s
        timeoutDuration: 300s
  bulkhead:
    bulkheadAspectOrder: 4
    instances:
      # Ask PhotoCast: at most four conversations talk to Claude at once; a fifth waits two seconds
      # and is then turned away (counted as load, not as a Claude fault, by the ask breaker).
      ask:
        maxConcurrentCalls: 4
        maxWaitDuration: 2s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN
      cache:
        time-to-live: 30s
  health:
    circuitbreakers:
      enabled: true
    ratelimiters:
      enabled: true
    mail:
      enabled: false
