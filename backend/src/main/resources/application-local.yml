spring:
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:file:./data/goldenhour;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        # Batch eager @ElementCollection loads on LocationEntity into IN-queries (see prod config).
        default_batch_fetch_size: 32
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
  mail:
    host: smtp.livemail.co.uk
    port: 587
    username: noreply@photocast.online
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
anthropic:
  api-key: ${ANTHROPIC_API_KEY:YOUR_ANTHROPIC_API_KEY}

worldtides:
  api-key: ${WORLDTIDES_API_KEY:}

notifications:
  admin-alerts:
    # Deliberately false here: application-local.yml's spring.mail block above points at a real
    # SMTP server (smtp.livemail.co.uk), so a local run with MAIL_PASSWORD set would otherwise
    # email every ADMIN account in the local DB whenever a run is degraded.
    enabled: false

logging:
  level:
    com.gregochr.goldenhour.config.RequestLoggingInterceptor: INFO

jwt:
  # Local dev secret — not used in production. Generate production value with: openssl rand -base64 32
  secret: bG9jYWwtZGV2LXNlY3JldC1rZXktZm9yLXRlc3Rpbmctb25seQ==
  access-token-expiry-hours: 24
  refresh-token-expiry-days: 30

turnstile:
  secret-key: ${TURNSTILE_SECRET_KEY:}

server:
  port: 8083
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain,text/css,application/javascript
    min-response-size: 1024

resilience4j:
  circuitbreaker:
    circuitBreakerAspectOrder: 1
    instances:
      # Ask PhotoCast's own breaker (AnthropicApiClient.createAskMessage): a reader's questions must
      # never be able to open the "anthropic" breaker the forecast pipeline shares. No health
      # indicator, so a breaker that opens on questions cannot flip the application's health.
      ask:
        registerHealthIndicator: false
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
      anthropic:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 60s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
      open-meteo:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 65s
        permittedNumberOfCallsInHalfOpenState: 1
        automaticTransitionFromOpenToHalfOpenEnabled: true
  retry:
    retryAspectOrder: 2
    instances:
      # Ask PhotoCast model turns: two attempts, server errors only (AskRetryPredicate).
      ask:
        maxAttempts: 2
        waitDuration: 500ms
      anthropic:
        maxAttempts: 4
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        exponentialMaxWaitDuration: 30s
      # Second, longer-window retry around Anthropic Batch API creation calls
      # (AnthropicBatchClient) — deliberately separate from "anthropic" above and much
      # slower: batch creation is a handful of calls per cycle, hours apart, so ~30s/60s/120s
      # of backoff (~3.5 min total on top of the SDK's own retries) is cheap insurance against
      # a transient Anthropic-side 5xx/timeout. See docs on the 2026-09-29 incident.
      anthropic-batch:
        maxAttempts: 4
        waitDuration: 30s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        exponentialMaxWaitDuration: 120s
      open-meteo:
        maxAttempts: 3
        waitDuration: 5s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
      # The briefing fetches retry per chunk inside the method, so a whole-method retry would
      # re-run every chunk and record the batch weather pre-fetch's calls twice. One attempt, as prod.
      open-meteo-briefing:
        maxAttempts: 1
  ratelimiter:
    rateLimiterAspectOrder: 3
    instances:
      open-meteo:
        limitForPeriod: 8
        limitRefreshPeriod: 1s
        timeoutDuration: 10s
  bulkhead:
    bulkheadAspectOrder: 4
    instances:
      # Ask PhotoCast: at most four conversations talk to Claude at once; a fifth waits two seconds
      # and is then turned away (counted as load, not as a Claude fault, by the ask breaker).
      ask:
        maxConcurrentCalls: 4
        maxWaitDuration: 2s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
      cache:
        time-to-live: 30s
      group:
        # Container/deploy probe: "this process is up and reaches its database". Deliberately excludes every
        # external-service indicator (openMeteo, claudeApi, tideCheck, circuit breakers, rate limiters) so a
        # third-party outage or quota (429) never marks the container unhealthy. Status only, no components.
        container:
          include: db,ping
          show-components: never
          show-details: never
  health:
    circuitbreakers:
      enabled: true
    ratelimiters:
      enabled: true
    mail:
      enabled: false

photocast:
  # Ask PhotoCast, local development. Both settings below are safe as committed defaults: the stub
  # engine makes no Anthropic call and writes no cost row, so a local run spends nothing.
  # NEVER set `stub: false` here to "try the real thing": it bills the real Anthropic key (about 1p a
  # question). To rehearse the real engine, override on the command line for that one run.
  ask:
    enabled: true
    stub: true
    # Off by default, and an override rather than a default: the fixture seeder writes three
    # "Fixture ..." regions, their locations, rated cache entries and synthetic tide extremes into
    # YOUR local H2 file, then triggers a briefing build. That build makes the same Claude calls a
    # normal build does (gloss, best bet) with whatever ANTHROPIC_API_KEY is set, so with a real key
    # it spends a few cents on every start that needs a rebuild. Turn it on for one run with
    #   -Dspring-boot.run.arguments=--photocast.ask.seed-local-fixture=true
    # (best against a fresh database: -Dspring-boot.run.arguments="--spring.datasource.url=jdbc:h2:file:./data/ask-fixture;AUTO_SERVER=TRUE").
    seed-local-fixture: false
  tide:
    gauges:                # weekly check of WorldTides high-water times against Environment Agency gauges
      enabled: true        # tide-source-integrity-plan P4. Contains Environment Agency data licensed under the
      min-pairs: 8         # Open Government Licence v3.0 (readings are not stored). min-pairs: fewest paired
      trailing-runs: 4     # high waters for a check to be recorded; trailing-runs: previous runs forming the
      flag-minutes: 10     # baseline; flag-minutes: movement of the median timing error that flags a gauge.
      measures:            # Locations are matched by NAME; an unknown name is skipped and logged.
        - measure-id: E70939-level-tidal_level-Mean-15_min-mAOD
          location-name: Tynemouth
        - measure-id: 022999-level-tidal_level-i-15_min-mAOD
          location-name: Blyth Beach
        - measure-id: L3901-level-tidal_level-i-15_min-mAOD
          location-name: "South Gare & Paddy's Hole"
        - measure-id: E71039-level-tidal_level-Mean-15_min-mAOD
          location-name: Whitby Piers
        - measure-id: L3001-level-tidal_level-i-15_min-m
          location-name: Bridlington North Beach
  tide-run:
    preferred-anchor: "St. Mary's Lighthouse"  # location NAME the spring/king tide run's 24-hour
                            # chart is drawn for. Blank restores pure biggest-range selection.
                            # Biggest-range is not neutral across a long roster: tidal range grows
                            # southward on this coast, so the maximum reliably lands at the
                            # southern end — a Bamburgh-to-Bridlington roster anchored every run to
                            # a cove on Flamborough Head, which no reader could place. Range picks
                            # the most dramatic version of the event; the anchor picks the legible
                            # one, and legibility is what the footer naming it was for.
                            # Matched by NAME, case-insensitively — ids differ between local H2 and
                            # production, so a configured id would silently select the wrong coast.
                            # Falls back to biggest range when the anchor is not in the run or has
                            # no drawable day, so a Yorkshire-only topic is never mislabelled.
