# Read by SonarCloud automatic analysis (no CI step runs the scanner, so this is the file it honours).
# The static landing and guide pages are hand-written HTML that share one head, masthead and footer by design
# (no templating step), so copy-detection there only measures that scaffolding, never logic. This is not a
# threshold change and excludes the pages from nothing but duplication detection.
sonar.cpd.exclusions=landing/**/*.html
