events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Logging
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log;

  sendfile on;
  keepalive_timeout 65;

  # Compress static assets at the origin. nginx's built-in default only gzips text/html,
  # so without gzip_types the hashed JS/CSS bundle was served uncompressed (relying on the
  # Cloudflare edge to re-compress). SSE (text/event-stream) is deliberately excluded so
  # streaming responses are never buffered. API JSON is already gzipped by the backend
  # (server.compression); nginx skips responses that already carry a Content-Encoding.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types application/javascript text/css application/json image/svg+xml application/manifest+json;

  server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets are content-addressed — Vite puts a content hash in every
    # filename, so a changed file gets a new URL. They can therefore be cached hard and
    # never revalidated for a year.
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # React Router: route all non-asset URLs to index.html. index.html and the other
    # unhashed root files (favicon, manifest) must always revalidate so a fresh deploy's
    # new asset hashes are picked up on the next visit. "no-cache" means "store but
    # revalidate", so an unchanged shell is a cheap 304, not a full re-download.
    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache";
    }

    # Proxy API calls to backend
    location /api/ {
      proxy_pass http://goldenhour-backend:8082;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
      proxy_read_timeout 300s;
      proxy_connect_timeout 300s;
    }

    # Proxy actuator endpoints to backend (for admin health checks)
    location /actuator/ {
      proxy_pass http://goldenhour-backend:8082;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
