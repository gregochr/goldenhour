events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Don't advertise the nginx version in the Server header (ZAP 10036).
  server_tokens off;

  # Logging
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log;

  sendfile on;
  keepalive_timeout 65;

  # Compress static assets at the origin. nginx's built-in default only gzips text/html,
  # so without gzip_types the hashed JS/CSS bundle was served uncompressed (relying on the
  # Cloudflare edge to re-compress). SSE (text/event-stream) is deliberately excluded so
  # streaming responses are never buffered. API JSON is already gzipped by the backend
  # (server.compression); nginx skips responses that already carry a Content-Encoding.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types application/javascript text/css application/json image/svg+xml application/manifest+json;

  server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ──────────────────────────────────────────────────────
    #
    # Set per-location rather than once at server level, because nginx's
    # add_header inheritance is a trap: a location that defines ANY add_header
    # of its own inherits NONE from the level above. Both /assets/ and / set
    # Cache-Control, so server-level security headers would silently vanish on
    # exactly the responses that need them — present in the config, absent on
    # the wire. Hence the repetition below; it is deliberate, not an oversight.
    #
    # Not applied to /api/ or /actuator/: those are proxied to Spring Security,
    # which already sets nosniff and X-Frame-Options, and duplicating them there
    # would only produce doubled headers on JSON that a browser never renders.
    #
    # CSP notes — every source here was verified against a real production build
    # (frontend/dist) rather than guessed:
    #   script-src  no 'unsafe-inline'. The build emits exactly one inline
    #               script, the <script nomodule> legacy-browser notice, which
    #               is allow-listed by hash. The PWA registration is external
    #               (/registerSW.js), so it needs no exception.
    #               challenges.cloudflare.com is the Turnstile CAPTCHA API.
    #   style-src   'unsafe-inline' IS needed: the nomodule fallback writes
    #               style="" attributes via innerHTML. Inline styles are a far
    #               smaller risk than inline scripts. No <style> blocks exist.
    #   img-src     server.arcgisonline.com serves the Leaflet dark basemap tiles
    #               (Esri Canvas dark-gray base + reference/labels overlay — free
    #               and keyless, unlike CARTO's basemaps.cartocdn.com which now
    #               requires a registered API key); data:/blob: cover generated
    #               marker icons.
    #   connect-src nominatim.openstreetmap.org is called directly from the
    #               browser for place-name geocoding; everything else is
    #               same-origin through this proxy.
    #   frame-src   Turnstile renders its widget in an iframe.
    #   worker-src  the vite-plugin-pwa service worker (sw.js).
    #
    # Deliberately NOT set: Cross-Origin-Embedder-Policy. ZAP flags it (90004),
    # but require-corp blocks any cross-origin subresource that doesn't send
    # CORP — which is both the Turnstile iframe and every basemap tile. Taking
    # that finding is the correct trade; breaking the map to satisfy a scanner
    # is not.
    #
    # If the inline nomodule block in index.html is ever edited, its hash below
    # must be regenerated or the legacy-browser notice will be blocked:
    #   grep -oPz '(?s)<script nomodule>\K.*?(?=</script>)' frontend/dist/index.html \
    #     | openssl dgst -sha256 -binary | openssl base64
    set $csp "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://challenges.cloudflare.com 'sha256-qsYZd9ya8nCFcoOrRzyN0rsu4eFGqQORBMUYZHi0soY='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://server.arcgisonline.com; font-src 'self'; connect-src 'self' https://nominatim.openstreetmap.org; frame-src https://challenges.cloudflare.com; worker-src 'self'; manifest-src 'self'; upgrade-insecure-requests";

    # Hashed build assets are content-addressed — Vite puts a content hash in every
    # filename, so a changed file gets a new URL. They can therefore be cached hard and
    # never revalidated for a year.
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";

      # Repeated, not inherited — see the note above.
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
      add_header Cross-Origin-Opener-Policy "same-origin" always;
      add_header Content-Security-Policy $csp always;
    }

    # React Router: route all non-asset URLs to index.html. index.html and the other
    # unhashed root files (favicon, manifest) must always revalidate so a fresh deploy's
    # new asset hashes are picked up on the next visit. "no-cache" means "store but
    # revalidate", so an unchanged shell is a cheap 304, not a full re-download.
    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache";

      # Repeated, not inherited — see the note above. This is the block that
      # matters most: it serves index.html, the document the CSP governs.
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
      add_header Cross-Origin-Opener-Policy "same-origin" always;
      add_header Content-Security-Policy $csp always;
    }

    # Proxy API calls to backend
    location /api/ {
      proxy_pass http://goldenhour-backend:8082;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
      proxy_read_timeout 300s;
      proxy_connect_timeout 300s;
    }

    # Proxy actuator endpoints to backend (for admin health checks)
    location /actuator/ {
      proxy_pass http://goldenhour-backend:8082;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
