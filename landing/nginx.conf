events {
    worker_connections 1024;
}
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log the path, never the query. $request_uri, not $uri: try_files rewrites $uri to /index.html
    # before the log line is written.
    map $request_uri $log_path {
        default           $request_uri;
        "~^(?<p>[^?]*)"   $p;
    }
    # The Referer carries the page's own URL, query included, on same-origin requests.
    map $http_referer $log_referer {
        default           $http_referer;
        "~^(?<r>[^?#]*)"  $r;
    }
    log_format redacted '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $log_path $server_protocol" $status $body_bytes_sent '
                        '"$log_referer" "$http_user_agent"';
    access_log  /var/log/nginx/access.log redacted;
    error_log   /var/log/nginx/error.log;

    sendfile        on;
    keepalive_timeout  65;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    server {
        listen       80;
        server_name  localhost;

        root   /usr/share/nginx/html;
        index  index.html;

        location ~* \.(jpg|jpeg|png|gif|svg|ico|css|js|webp)$ {
            # A missing asset is a routine 404; the error log would record the page's Referer.
            log_not_found off;
            # Asset URLs are content-fingerprinted by the Dockerfile, so a long cache is safe.
            expires 30d;
            add_header Cache-Control "public, no-transform";
            include /etc/nginx/security-headers.conf;
        }

        include /etc/nginx/security-headers.conf;

        # HTML pages: revalidate on every visit (ETag/Last-Modified keep it a cheap 304), so a deploy
        # is seen at once. The error_page 404 below is an internal redirect to /index.html, which
        # lands here too.
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache" always;
            include /etc/nginx/security-headers.conf;
        }

        error_page 404 /index.html;
    }
}
