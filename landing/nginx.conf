events {
    worker_connections 1024;
}
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log the path, never the query. $request_uri, not $uri: try_files rewrites $uri to /index.html
    # before the log line is written.
    map $request_uri $log_path {
        default           $request_uri;
        "~^(?<p>[^?]*)"   $p;
    }
    # The Referer carries the page's own URL, query included, on same-origin requests.
    map $http_referer $log_referer {
        default           $http_referer;
        "~^(?<r>[^?#]*)"  $r;
    }
    # Framing policy, read by security-headers.conf. The guide pages are framed by the app's help panel
    # (app.photocast.online) and by nobody else; every other page may be framed only by itself. Keyed on
    # $uri, which is the final URI after an internal redirect, so the guide's own 404 page counts as guide.
    # An empty $x_frame_options makes nginx omit the header: X-Frame-Options would refuse the app too.
    map $uri $x_frame_options {
        default      "SAMEORIGIN";
        "~^/guide/"  "";
    }
    map $uri $csp_frame_ancestors {
        default      "'self'";
        "~^/guide/"  "https://app.photocast.online";
    }

    log_format redacted '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $log_path $server_protocol" $status $body_bytes_sent '
                        '"$log_referer" "$http_user_agent"';
    access_log  /var/log/nginx/access.log redacted;
    error_log   /var/log/nginx/error.log;

    sendfile        on;
    keepalive_timeout  65;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    server {
        listen       80;
        server_name  localhost;

        root   /usr/share/nginx/html;
        index  index.html;

        location ~* \.(jpg|jpeg|png|gif|svg|ico|css|js|webp)$ {
            # A missing asset is a routine 404; the error log would record the page's Referer.
            log_not_found off;
            # Asset URLs are content-fingerprinted by the Dockerfile, so a long cache is safe.
            expires 30d;
            add_header Cache-Control "public, no-transform";
            include /etc/nginx/security-headers.conf;
        }

        include /etc/nginx/security-headers.conf;

        # /guide without the slash would serve the hub at the wrong base, so every relative URL breaks.
        # absolute_redirect off: nginx sees plain http behind the tunnel, so an absolute Location would
        # downgrade the scheme.
        location = /guide {
            absolute_redirect off;
            return 301 /guide/;
        }

        # The guide pages are framed by the app's help panel (app.photocast.online) and by nobody else.
        # The maps above give them frame-ancestors for the app only and no X-Frame-Options (which would
        # refuse the app too), so this location includes the same security-headers.conf as the rest. Its
        # own error_page keeps a mistyped guide URL inside /guide/ (the server-level 404 would send the
        # marketing page with SAMEORIGIN, which the panel refuses to show). Guide css/js/webp are matched
        # by the asset regex location above (regex beats a plain prefix) and keep the 30-day cache.
        location /guide/ {
            try_files $uri $uri/ =404;
            error_page 404 /guide/index.html;
            add_header Cache-Control "no-cache" always;
            include /etc/nginx/security-headers.conf;
        }

        # HTML pages: revalidate on every visit (ETag/Last-Modified keep it a cheap 304), so a deploy
        # is seen at once. The error_page 404 below is an internal redirect to /index.html, which
        # lands here too.
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache" always;
            include /etc/nginx/security-headers.conf;
        }

        error_page 404 /index.html;
    }
}
