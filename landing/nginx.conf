events {
    worker_connections 1024;
}
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log;

    sendfile        on;
    keepalive_timeout  65;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    server {
        listen       80;
        server_name  localhost;

        root   /usr/share/nginx/html;
        index  index.html;

        location ~* \.(jpg|jpeg|png|gif|svg|ico|css|js|webp)$ {
            # Asset URLs are content-fingerprinted by the Dockerfile, so a long cache is safe.
            expires 30d;
            add_header Cache-Control "public, no-transform";
            include /etc/nginx/security-headers.conf;
        }

        include /etc/nginx/security-headers.conf;

        # HTML pages: revalidate on every visit (ETag/Last-Modified keep it a cheap 304), so a deploy
        # is seen at once. The error_page 404 below is an internal redirect to /index.html, which
        # lands here too.
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache" always;
            include /etc/nginx/security-headers.conf;
        }

        error_page 404 /index.html;
    }
}
