# Security headers, included by nginx.conf in the server block and in every location that sets its own
# add_header. nginx inherits add_header from the enclosing level ONLY when the current level sets none,
# so a location with its own add_header (Cache-Control) silently drops the server-level ones. Every such
# location must therefore repeat these, which is why they live in one file.
#
# The two things that differ for /guide/ (framed by the app's help panel, and by nobody else) are the
# variables $x_frame_options and $csp_frame_ancestors, mapped from $uri in nginx.conf's http block. For
# /guide/ the first is empty, and nginx omits a header whose value is empty, so X-Frame-Options (which
# would refuse the app too) is NOT sent there and frame-ancestors names the app only. Everywhere else
# X-Frame-Options is SAMEORIGIN (old browsers) and frame-ancestors is 'self'.
#
# The Content-Security-Policy is sized to what the pages load, and nothing wider: same-origin scripts
# (no inline script, no on*= handler), same-origin styles plus the Google Fonts stylesheet (no inline
# <style> block, no style="" attribute: landingNginxConf.test.js fails the build if one comes back),
# Google's font files, same-origin images (and data: URIs), and same-origin fetch() for the guide
# search. There are no forms, frames or media.
# Navigation to app.photocast.online and the social links is not governed by CSP.
add_header X-Frame-Options $x_frame_options always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors $csp_frame_ancestors; upgrade-insecure-requests" always;
